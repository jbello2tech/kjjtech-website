name = "kjjtech-billing"
main = "src/index.js"
compatibility_date = "2026-04-01"
account_id = "01d3e66e6823e2669272faa7917f9fab"
workers_dev = true   # backup URL with IPv4 (custom domain only had IPv6 at launch)

# Stripe webhook -> Discord + email alerts for 5G data SIM orders and billing.
# Stripe endpoint URL: https://kjjtech-billing.kjj-tech.workers.dev/stripe (billing.kjjtech.com also routes here)

[vars]
MAIL_FROM = "jbello@kjjtech.com"
NOTIFY_TO = "jbello@kjjtech.com"
# Payment links for the 5G data SIM (used to label new orders)
SIM_MONTHLY_LINK = "plink_1UfYRkD3xMZIuk8aL8bg23Ls"
SIM_YEARLY_LINK = "plink_1UfYUBD3xMZIuk8a3vc6Qvnf"
# Discord user pinged on failed payments and cancellations
DISCORD_MENTION_USER_ID = "1197638562041036824"

# Secrets (set with `npx wrangler secret put NAME`):
#   STRIPE_WEBHOOK_SECRET   whsec_... from the Stripe webhook endpoint (required)
#   DISCORD_WEBHOOK_URL     Discord channel webhook for billing alerts (required)
#   MS_TENANT_ID, MS_CLIENT_ID, MS_CLIENT_SECRET   same Microsoft Graph app as the reviews worker (for email)
#   STRIPE_READ_KEY         optional: restricted read-only Stripe key, adds customer names to subscription alerts

[[routes]]
pattern = "billing.kjjtech.com"
custom_domain = true

# Remembers processed Stripe event IDs for 7 days so retries/resends never alert twice
[[kv_namespaces]]
binding = "SEEN"
id = "947b515308ac47fb88b898498c5d2b21"
