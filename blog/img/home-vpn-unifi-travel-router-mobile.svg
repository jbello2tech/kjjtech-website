<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1573" width="640" height="1573" role="img" aria-label="UniFi home VPN with a travel router: laptop and phone connect to a GL.iNet Beryl 7 or UniFi Travel Router, which tunnels over hotel Wi-Fi to the WireGuard server on your UniFi gateway, so websites see your home IP" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>UniFi home VPN with a travel router: laptop and phone connect to a GL.iNet Beryl 7 or UniFi Travel Router, which tunnels over hotel Wi-Fi to the WireGuard server on your UniFi gateway, so websites see your home IP</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1s linear infinite}
.drift{animation:drift 9s ease-in-out infinite alternate}
.drift2{animation:drift 12s ease-in-out infinite alternate-reverse}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pkt{display:none}}
</style>
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.07"/></filter>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1.2" fill="#e6e6e6"/></pattern>
</defs>
<rect width="640" height="1573" fill="#ffffff"/>
<text x="32.0" y="58.0" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">Home VPN with a travel router</text><text x="32.0" y="103.0" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">The travel router joins the hotel Wi-Fi and</text><text x="32.0" y="133.0" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">builds one WireGuard tunnel home. Your devices</text><text x="32.0" y="163.0" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">just connect to the travel router.</text><rect x="20" y="203" width="600" height="400" rx="20" fill="#f9f9f9" stroke="#ececec"/><rect x="20" y="203" width="600" height="400" rx="20" fill="url(#dots)"/><text x="40.0" y="237.0" font-size="22" fill="#5f6368" font-weight="600" text-anchor="start" letter-spacing="2.2">ON THE ROAD</text><path id="p1" d="M170 371 C170 438 320 363 320 437" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-dasharray="3 6" stroke-linecap="round"/><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="0.00s"/><animateMotion dur="1.3s" begin="0.00s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><path id="p2" d="M470 371 C470 438 320 363 320 437" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-dasharray="3 6" stroke-linecap="round"/><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="0.40s"/><animateMotion dur="1.3s" begin="0.40s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><g class="rise" style="animation-delay:0.10s"><rect x="70.0" y="265.0" width="200" height="106" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(149.0,279.0) scale(1.75)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M1 20h22"/></g><text x="170.0" y="355.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">Laptop</text></g><g class="rise" style="animation-delay:0.20s"><rect x="370.0" y="265.0" width="200" height="106" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(449.0,279.0) scale(1.75)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="10.5" y1="18" x2="13.5" y2="18"/></g><text x="470.0" y="355.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">Phone</text></g><g class="rise" style="animation-delay:0.25s"><rect x="170.0" y="437.0" width="300" height="132" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" filter="url(#sh)"/><g transform="translate(299.0,451.0) scale(1.75)" fill="none" stroke="#1d4ed8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#1d4ed8"><rect x="2" y="11" width="20" height="9" rx="2.5"/><path d="M6 11V6M18 11V6"/><circle cx="7" cy="15.5" r="1" fill="currentColor"/><path d="M11 15.5h6"/></g><text x="320.0" y="527.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">Travel router</text><text x="320.0" y="554.0" font-size="19" fill="#5f6368" font-weight="400" text-anchor="middle">Beryl 7 or UTR</text></g><rect x="20" y="1093" width="600" height="450" rx="20" fill="#f9f9f9" stroke="#ececec"/><rect x="20" y="1093" width="600" height="450" rx="20" fill="url(#dots)"/><text x="40.0" y="1127.0" font-size="22" fill="#5f6368" font-weight="600" text-anchor="start" letter-spacing="2.2">HOME</text><g transform="translate(248.0,704.4) scale(11)"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="#ffffff" fill-opacity="0.85" stroke="#c4c4c4" stroke-width="1.5" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/></g><text x="416.8" y="893.6" font-size="18" fill="#5f6368" font-weight="600" text-anchor="middle" letter-spacing="2.4">HOTEL WI-FI</text><path d="M320 569 L320 1147" fill="none" stroke="#1d4ed8" stroke-opacity="0.10" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path id="p3" d="M320 569 L320 1147" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="10 8" class="flow" stroke-linecap="round" stroke-linejoin="round"/><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="0.00s"/><animateMotion dur="3.4s" begin="0.00s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="1.13s"/><animateMotion dur="3.4s" begin="1.13s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="2.27s"/><animateMotion dur="3.4s" begin="2.27s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><g class="pop" style="animation-delay:0.80s"><rect x="198.2" y="971.0" width="243.6" height="44.0" rx="22.0" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5"/><g transform="translate(212.2,979.7) scale(1.11)" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></g><text x="332.0" y="1000.2" font-size="20" fill="#1d4ed8" font-weight="700" text-anchor="middle">WireGuard tunnel</text></g><g class="rise" style="animation-delay:0.50s"><rect x="170.0" y="1147.0" width="300" height="132" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" filter="url(#sh)"/><g transform="translate(299.0,1161.0) scale(1.75)" fill="none" stroke="#1d4ed8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#1d4ed8"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></g><text x="320.0" y="1237.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">UniFi gateway</text><text x="320.0" y="1264.0" font-size="19" fill="#5f6368" font-weight="400" text-anchor="middle">WireGuard server</text></g><path id="p4" d="M320 1279 L320 1350" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="1.00s"/><animateMotion dur="1.4s" begin="1.00s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle><g class="rise" style="animation-delay:0.65s"><rect x="170.0" y="1350.0" width="300" height="106" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(299.0,1364.0) scale(1.75)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></g><text x="320.0" y="1440.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">Websites</text></g><g class="pop" style="animation-delay:1.10s"><rect x="210.2" y="1481.0" width="219.6" height="44.0" rx="22.0" fill="#e7f5ec" stroke="#15803d" stroke-width="1.5"/><text x="320.0" y="1510.2" font-size="20" fill="#15803d" font-weight="700" text-anchor="middle">See your home IP</text></g>
</svg>
