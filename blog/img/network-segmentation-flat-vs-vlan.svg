<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Flat network versus segmented network: a hacked smart plug reaches every device on a flat network but is blocked by VLANs and firewall zones" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Flat network versus segmented network: a hacked smart plug reaches every device on a flat network but is blocked by VLANs and firewall zones</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.grow{animation:grow 1s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}
.flow{stroke-dasharray:10 8;animation:flow .9s linear infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.8s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.04)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="500" fill="#ffffff"/>
<text x="40" y="52" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">Why segmenting your network matters</text><text x="40" y="80" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">One compromised smart device, two very different outcomes.</text><defs><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect x="40" y="110" width="540" height="330" rx="14" fill="#f5f6f8" stroke="#d9dce1" stroke-width="1.5"/><text x="64" y="146" font-size="19" fill="#0a0a0a" font-weight="700" text-anchor="start">Flat network</text><text x="64" y="170" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">Everything can reach everything</text><rect x="100" y="226" width="140" height="48" rx="10" fill="#fbeaea" stroke="#b91c1c" stroke-width="1.8"/><text x="170" y="256" font-size="15" fill="#b91c1c" font-weight="600" text-anchor="middle">Hacked plug</text><rect x="380" y="196" width="140" height="48" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.8"/><text x="450" y="226" font-size="15" fill="#0a0a0a" font-weight="600" text-anchor="middle">Laptop</text><line x1="242" y1="250" x2="378" y2="220" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#aR)" class="flow"/><rect x="380" y="276" width="140" height="48" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.8"/><text x="450" y="306" font-size="15" fill="#0a0a0a" font-weight="600" text-anchor="middle">File server</text><line x1="242" y1="250" x2="378" y2="300" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#aR)" class="flow"/><rect x="230" y="356" width="140" height="48" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.8"/><text x="300" y="386" font-size="15" fill="#0a0a0a" font-weight="600" text-anchor="middle">Cameras</text><line x1="200" y1="276" x2="280" y2="354" stroke="#b91c1c" stroke-width="2.2" marker-end="url(#aR)" class="flow"/><rect x="620" y="110" width="540" height="330" rx="14" fill="#f5f6f8" stroke="#d9dce1" stroke-width="1.5"/><text x="644" y="146" font-size="19" fill="#0a0a0a" font-weight="700" text-anchor="start">Segmented with VLANs</text><text x="644" y="170" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">IoT can reach the internet, nothing else</text><rect x="640" y="196" width="200" height="220" rx="12" fill="#fdf3e4" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 5"/><text x="740" y="222" font-size="14" fill="#b45309" font-weight="700" text-anchor="middle">IoT VLAN</text><rect x="670" y="276" width="140" height="48" rx="10" fill="#fbeaea" stroke="#b91c1c" stroke-width="1.8"/><text x="740" y="306" font-size="15" fill="#b91c1c" font-weight="600" text-anchor="middle">Hacked plug</text><rect x="900" y="196" width="240" height="220" rx="12" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.8" stroke-dasharray="6 5"/><text x="1020" y="222" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="middle">Trusted VLAN</text><rect x="950" y="246" width="140" height="48" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.8"/><text x="1020" y="276" font-size="15" fill="#0a0a0a" font-weight="600" text-anchor="middle">Laptop</text><rect x="950" y="326" width="140" height="48" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.8"/><text x="1020" y="356" font-size="15" fill="#0a0a0a" font-weight="600" text-anchor="middle">File server</text><line x1="812" y1="300" x2="868" y2="300" stroke="#b91c1c" stroke-width="2.2" class="flow"/><g class="pulse"><circle cx="884" cy="300" r="14" fill="#ffffff" stroke="#b91c1c" stroke-width="2.5"/><line x1="876" y1="292" x2="892" y2="308" stroke="#b91c1c" stroke-width="2.5"/><line x1="892" y1="292" x2="876" y2="308" stroke="#b91c1c" stroke-width="2.5"/></g><text x="740" y="400" font-size="14" fill="#b91c1c" font-weight="700" text-anchor="middle">Blocked at the firewall</text>
</svg>
