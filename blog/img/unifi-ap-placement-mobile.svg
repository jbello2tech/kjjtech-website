<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1234.2" width="640" height="1234.2" role="img" aria-label="UniFi access point placement: two APs centered in each half of a single-story home, and ceiling APs offset between floors in a two-story home" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>UniFi access point placement: two APs centered in each half of a single-story home, and ceiling APs offset between floors in a two-story home</title>
<rect width="640" height="1234.2" fill="#ffffff"/>
<text x="32" y="58" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">Where to put access points</text><text x="32" y="104.8" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">Ceiling-mount at 8–10 ft. Center each AP in the</text><text x="32" y="134.5" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">area it covers.</text><text x="32" y="202.2" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="start">Single-story home, 2 APs (top view)</text><clipPath id="c1"><rect x="32" y="222.2" width="576" height="280" rx="12"/></clipPath><rect x="32" y="222.2" width="576" height="280" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="3"/><g clip-path="url(#c1)"><circle cx="176.0" cy="348.2" r="150" fill="#1d4ed8" fill-opacity="0.08" stroke="#1d4ed8" stroke-opacity="0.35" stroke-dasharray="8 8" stroke-width="2"/><circle cx="176.0" cy="348.2" r="20" fill="#1d4ed8"/><circle cx="176.0" cy="348.2" r="7" fill="#ffffff"/><circle cx="464.0" cy="348.2" r="150" fill="#1d4ed8" fill-opacity="0.08" stroke="#1d4ed8" stroke-opacity="0.35" stroke-dasharray="8 8" stroke-width="2"/><circle cx="464.0" cy="348.2" r="20" fill="#1d4ed8"/><circle cx="464.0" cy="348.2" r="7" fill="#ffffff"/></g><line x1="320.0" y1="222.2" x2="320.0" y2="502.2" stroke="#0a0a0a" stroke-width="2" stroke-dasharray="10 8"/><text x="176.0" y="482.2" font-size="21" fill="#5f6368" font-weight="400" text-anchor="middle">Center of half 1</text><text x="464.0" y="482.2" font-size="21" fill="#5f6368" font-weight="400" text-anchor="middle">Center of half 2</text><text x="32" y="558.2" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="start">Two-story home (side view)</text><rect x="32" y="578.2" width="576" height="150" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="3"/><text x="50" y="710.2" font-size="21" fill="#5f6368" font-weight="400" text-anchor="start">2nd floor</text><rect x="32" y="742.2" width="576" height="150" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="3"/><text x="50" y="874.2" font-size="21" fill="#5f6368" font-weight="400" text-anchor="start">1st floor</text><rect x="170.79999999999998" y="584.2" width="68" height="16" rx="8" fill="#1d4ed8"/><text x="204.79999999999998" y="632.2" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="middle">AP on ceiling</text><path d="M94.79999999999998,672.2 Q204.79999999999998,722.2 314.79999999999995,672.2" fill="none" stroke="#1d4ed8" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="8 8"/><rect x="401.2" y="748.2" width="68" height="16" rx="8" fill="#1d4ed8"/><text x="435.2" y="796.2" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="middle">AP on ceiling</text><path d="M325.2,836.2 Q435.2,886.2 545.2,836.2" fill="none" stroke="#1d4ed8" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="8 8"/><text x="590" y="710.2" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="end">Offset, not stacked</text><text x="32" y="942.2" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="start">How many APs?</text><rect x="32" y="960.2" width="576" height="56" rx="28" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="56" y="997.2" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">Under 1,500 sq ft</text><text x="584" y="997.2" font-size="22" fill="#0a0a0a" font-weight="700" text-anchor="end">1 AP</text><rect x="32" y="1026.2" width="576" height="56" rx="28" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="56" y="1063.2" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">1,500–3,000 sq ft</text><text x="584" y="1063.2" font-size="22" fill="#0a0a0a" font-weight="700" text-anchor="end">2 APs</text><rect x="32" y="1092.2" width="576" height="56" rx="28" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="56" y="1129.2" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">3,000–5,000 sq ft</text><text x="584" y="1129.2" font-size="22" fill="#0a0a0a" font-weight="700" text-anchor="end">3–4 APs</text><rect x="32" y="1158.2" width="576" height="56" rx="28" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="56" y="1195.2" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">Office</text><text x="584" y="1195.2" font-size="22" fill="#0a0a0a" font-weight="700" text-anchor="end">1 per 1,000–1,500 sq ft</text>
</svg>
