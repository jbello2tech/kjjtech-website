<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 619.8" width="640" height="619.8" role="img" aria-label="5-year cost comparison: UniFi about $1,200 versus Meraki $8,000 to $15,000 for 5 managed devices" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>5-year cost comparison: UniFi about $1,200 versus Meraki $8,000 to $15,000 for 5 managed devices</title>
<rect width="640" height="619.8" fill="#ffffff"/>
<text x="32" y="58" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">5-year cost, 5 managed devices</text><text x="32" y="104.8" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">Hardware plus licenses. UniFi has no license</text><text x="32" y="134.5" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">fee; Meraki needs one per device, every year.</text><text x="32" y="218.2" font-size="28" fill="#0a0a0a" font-weight="700" text-anchor="start">UniFi</text><text x="608" y="218.2" font-size="26" fill="#1d4ed8" font-weight="700" text-anchor="end">about $1,200</text><rect x="32" y="234.2" width="43.19999999999999" height="52" rx="8" fill="#1d4ed8"/><text x="32" y="358.2" font-size="28" fill="#0a0a0a" font-weight="700" text-anchor="start">Meraki</text><text x="608" y="358.2" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="end">$8,000–$15,000</text><rect x="32" y="374.2" width="288.0" height="52" rx="8" fill="#0a0a0a"/><rect x="320.0" y="374.2" width="252.0" height="52" rx="8" fill="#0a0a0a" fill-opacity="0.25"/><line x1="32.0" y1="228.2" x2="32.0" y2="442.2" stroke="#eceef1" stroke-width="2"/><text x="32.0" y="468.2" font-size="20" fill="#5f6368" font-weight="400" text-anchor="start">$0</text><line x1="320.0" y1="228.2" x2="320.0" y2="442.2" stroke="#eceef1" stroke-width="2"/><text x="320.0" y="468.2" font-size="20" fill="#5f6368" font-weight="400" text-anchor="middle">$8k</text><line x1="608.0" y1="228.2" x2="608.0" y2="442.2" stroke="#eceef1" stroke-width="2"/><text x="608.0" y="468.2" font-size="20" fill="#5f6368" font-weight="400" text-anchor="end">$16k</text><rect x="32" y="490.2" width="22" height="18" rx="4" fill="#0a0a0a"/><text x="64" y="506.2" font-size="21" fill="#5f6368" font-weight="400" text-anchor="start">Low estimate</text><rect x="252" y="490.2" width="22" height="18" rx="4" fill="#0a0a0a" fill-opacity="0.25"/><text x="284" y="506.2" font-size="21" fill="#5f6368" font-weight="400" text-anchor="start">Up to high estimate</text><text x="32" y="554.2" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">If a Meraki license lapses, the hardware stops</text><text x="32" y="585.0" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">working as a managed device.</text>
</svg>
