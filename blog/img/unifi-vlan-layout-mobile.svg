<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1108.5" width="640" height="1108.5" role="img" aria-label="UniFi VLAN layout: Management VLAN 1, Trusted VLAN 10, IoT VLAN 20, Guest VLAN 30, Cameras VLAN 40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>UniFi VLAN layout: Management VLAN 1, Trusted VLAN 10, IoT VLAN 20, Guest VLAN 30, Cameras VLAN 40</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.grow{animation:grow 1s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}
.flow{stroke-dasharray:10 8;animation:flow .9s linear infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.8s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.04)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="640" height="1108.5" fill="#ffffff"/>
<text x="32" y="58" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">A typical UniFi VLAN layout</text><text x="32" y="104.8" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">The subnet's third number matches the VLAN ID.</text><rect x="170.0" y="148.5" width="300" height="64" rx="12" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="320.0" y="190.5" font-size="26" fill="#ffffff" font-weight="700" text-anchor="middle">UniFi Gateway</text><line x1="320.0" y1="212.5" x2="320.0" y2="240.5" stroke="#0a0a0a" stroke-width="3"/><rect x="170.0" y="240.5" width="300" height="60" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/><text x="320.0" y="279.5" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">Switch + APs</text><line x1="320.0" y1="300.5" x2="320.0" y2="326.5" stroke="#0a0a0a" stroke-width="3"/><line x1="320.0" y1="326.5" x2="46" y2="326.5" stroke="#0a0a0a" stroke-width="3"/><g class="rise" style="animation-delay:0.20s"><line x1="46" y1="414.5" x2="76" y2="414.5" stroke="#0a0a0a" stroke-width="3"/><rect x="76" y="348.5" width="532" height="132" rx="14" fill="#f5f6f8" stroke="#0a0a0a" stroke-width="2.5"/><rect x="76" y="348.5" width="10" height="132" rx="5" fill="#0a0a0a"/><text x="104" y="390.5" font-size="28" fill="#0a0a0a" font-weight="700" text-anchor="start">Management</text><text x="586" y="390.5" font-size="22" fill="#0a0a0a" font-weight="700" text-anchor="end">VLAN 1 (untagged)</text><text x="104" y="426.5" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">192.168.1.0/24</text><text x="104" y="460.5" font-size="22" fill="#0a0a0a" font-weight="400" text-anchor="start">Gateway, switches, APs</text></g><g class="rise" style="animation-delay:0.34s"><line x1="46" y1="564.5" x2="76" y2="564.5" stroke="#0a0a0a" stroke-width="3"/><rect x="76" y="498.5" width="532" height="132" rx="14" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2.5"/><rect x="76" y="498.5" width="10" height="132" rx="5" fill="#1d4ed8"/><text x="104" y="540.5" font-size="28" fill="#0a0a0a" font-weight="700" text-anchor="start">Trusted</text><text x="586" y="540.5" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="end">VLAN 10</text><text x="104" y="576.5" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">192.168.10.0/24</text><text x="104" y="610.5" font-size="22" fill="#0a0a0a" font-weight="400" text-anchor="start">Laptops, desktops, your phones</text></g><g class="rise" style="animation-delay:0.48s"><line x1="46" y1="714.5" x2="76" y2="714.5" stroke="#0a0a0a" stroke-width="3"/><rect x="76" y="648.5" width="532" height="132" rx="14" fill="#fdf3e4" stroke="#b45309" stroke-width="2.5"/><rect x="76" y="648.5" width="10" height="132" rx="5" fill="#b45309"/><text x="104" y="690.5" font-size="28" fill="#0a0a0a" font-weight="700" text-anchor="start">IoT</text><text x="586" y="690.5" font-size="22" fill="#b45309" font-weight="700" text-anchor="end">VLAN 20</text><text x="104" y="726.5" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">192.168.20.0/24</text><text x="104" y="760.5" font-size="22" fill="#0a0a0a" font-weight="400" text-anchor="start">TVs, speakers, thermostats, plugs</text></g><g class="rise" style="animation-delay:0.62s"><line x1="46" y1="864.5" x2="76" y2="864.5" stroke="#0a0a0a" stroke-width="3"/><rect x="76" y="798.5" width="532" height="132" rx="14" fill="#e7f5ec" stroke="#15803d" stroke-width="2.5"/><rect x="76" y="798.5" width="10" height="132" rx="5" fill="#15803d"/><text x="104" y="840.5" font-size="28" fill="#0a0a0a" font-weight="700" text-anchor="start">Guest</text><text x="586" y="840.5" font-size="22" fill="#15803d" font-weight="700" text-anchor="end">VLAN 30</text><text x="104" y="876.5" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">192.168.30.0/24</text><text x="104" y="910.5" font-size="22" fill="#0a0a0a" font-weight="400" text-anchor="start">Visitors. Internet only</text></g><g class="rise" style="animation-delay:0.76s"><line x1="46" y1="1014.5" x2="76" y2="1014.5" stroke="#0a0a0a" stroke-width="3"/><rect x="76" y="948.5" width="532" height="132" rx="14" fill="#fbeaea" stroke="#b91c1c" stroke-width="2.5"/><rect x="76" y="948.5" width="10" height="132" rx="5" fill="#b91c1c"/><text x="104" y="990.5" font-size="28" fill="#0a0a0a" font-weight="700" text-anchor="start">Cameras</text><text x="586" y="990.5" font-size="22" fill="#b91c1c" font-weight="700" text-anchor="end">VLAN 40</text><text x="104" y="1026.5" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">192.168.40.0/24</text><text x="104" y="1060.5" font-size="22" fill="#0a0a0a" font-weight="400" text-anchor="start">Cameras and NVR, no internet</text></g><line x1="46" y1="326.5" x2="46" y2="1014.5" stroke="#0a0a0a" stroke-width="3"/>
</svg>
