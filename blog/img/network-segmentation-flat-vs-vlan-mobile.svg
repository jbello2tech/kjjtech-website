<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1023.0" width="640" height="1023.0" role="img" aria-label="Flat network versus segmented network: a hacked smart plug reaches every device on a flat network but is blocked by VLANs and firewall zones" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Flat network versus segmented network: a hacked smart plug reaches every device on a flat network but is blocked by VLANs and firewall zones</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.grow{animation:grow 1s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}
.flow{stroke-dasharray:10 8;animation:flow .9s linear infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.8s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.04)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="640" height="1023.0" fill="#ffffff"/>
<text x="32" y="58" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">Why segmenting your network</text><text x="32" y="98.8" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">matters</text><text x="32" y="145.6" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">One hacked smart device, two very different</text><text x="32" y="175.3" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">outcomes.</text><defs><marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs><rect x="32" y="219.0" width="576" height="360" rx="16" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="56" y="263.0" font-size="28" fill="#0a0a0a" font-weight="700" text-anchor="start">Flat network</text><text x="56" y="297.0" font-size="21" fill="#5f6368" font-weight="400" text-anchor="start">Everything can reach everything</text><rect x="62.0" y="409.0" width="180" height="60" rx="12" fill="#fbeaea" stroke="#b91c1c" stroke-width="2.5"/><text x="152" y="447.0" font-size="22" fill="#b91c1c" font-weight="700" text-anchor="middle">Hacked plug</text><rect x="398.0" y="329.0" width="180" height="60" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="2.5"/><text x="488" y="367.0" font-size="22" fill="#0a0a0a" font-weight="700" text-anchor="middle">Laptop</text><line x1="244" y1="427.0" x2="392" y2="359.0" stroke="#b91c1c" stroke-width="3" marker-end="url(#aR)" class="flow"/><rect x="398.0" y="409.0" width="180" height="60" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="2.5"/><text x="488" y="447.0" font-size="22" fill="#0a0a0a" font-weight="700" text-anchor="middle">File server</text><line x1="244" y1="439.0" x2="392" y2="439.0" stroke="#b91c1c" stroke-width="3" marker-end="url(#aR)" class="flow"/><rect x="398.0" y="489.0" width="180" height="60" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="2.5"/><text x="488" y="527.0" font-size="22" fill="#0a0a0a" font-weight="700" text-anchor="middle">Cameras</text><line x1="244" y1="451.0" x2="392" y2="519.0" stroke="#b91c1c" stroke-width="3" marker-end="url(#aR)" class="flow"/><rect x="32" y="603.0" width="576" height="400" rx="16" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="56" y="647.0" font-size="28" fill="#0a0a0a" font-weight="700" text-anchor="start">Segmented with VLANs</text><text x="56" y="681.0" font-size="21" fill="#5f6368" font-weight="400" text-anchor="start">IoT can reach the internet, nothing else</text><rect x="50" y="707.0" width="230" height="270" rx="12" fill="#fdf3e4" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 6"/><text x="165.0" y="743.0" font-size="21" fill="#b45309" font-weight="700" text-anchor="middle">IoT VLAN</text><rect x="70.0" y="817.0" width="190" height="60" rx="12" fill="#fbeaea" stroke="#b91c1c" stroke-width="2.5"/><text x="165.0" y="855.0" font-size="22" fill="#b91c1c" font-weight="700" text-anchor="middle">Hacked plug</text><rect x="360" y="707.0" width="230" height="270" rx="12" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="8 6"/><text x="475.0" y="743.0" font-size="21" fill="#1d4ed8" font-weight="700" text-anchor="middle">Trusted VLAN</text><rect x="385.0" y="787.0" width="180" height="60" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="2.5"/><text x="475.0" y="825.0" font-size="22" fill="#0a0a0a" font-weight="700" text-anchor="middle">Laptop</text><rect x="385.0" y="873.0" width="180" height="60" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="2.5"/><text x="475.0" y="911.0" font-size="22" fill="#0a0a0a" font-weight="700" text-anchor="middle">File server</text><line x1="261.0" y1="847.0" x2="300.0" y2="847.0" stroke="#b91c1c" stroke-width="3" class="flow"/><g class="pulse"><circle cx="320.0" cy="847.0" r="18" fill="#ffffff" stroke="#b91c1c" stroke-width="3"/><line x1="311.0" y1="838.0" x2="329.0" y2="856.0" stroke="#b91c1c" stroke-width="3"/><line x1="329.0" y1="838.0" x2="311.0" y2="856.0" stroke="#b91c1c" stroke-width="3"/></g><text x="165.0" y="943.0" font-size="22" fill="#b91c1c" font-weight="700" text-anchor="middle">Blocked</text>
</svg>
