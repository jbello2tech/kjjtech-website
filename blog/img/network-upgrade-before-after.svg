<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Small business network before and after: an ISP router with one shared network versus a business gateway, PoE switch, access points and separate staff, guest and device networks" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Small business network before and after: an ISP router with one shared network versus a business gateway, PoE switch, access points and separate staff, guest and device networks</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.grow{animation:grow 1s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}
.flow{stroke-dasharray:10 8;animation:flow .9s linear infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.8s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.04)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="520" fill="#ffffff"/>
<text x="40" y="52" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">What a small business network upgrade looks like</text><text x="40" y="80" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">From one ISP box doing everything to a setup built for the business.</text><defs><marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a0a0a"/></marker></defs><rect x="40" y="110" width="520" height="360" rx="14" fill="#f5f6f8" stroke="#d9dce1" stroke-width="1.5"/><text x="64" y="146" font-size="20" fill="#0a0a0a" font-weight="700" text-anchor="start">Before</text><rect x="200" y="180" width="200" height="60" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/><text x="300" y="208" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">ISP router</text><text x="300" y="228" font-size="13" fill="#5f6368" font-weight="400" text-anchor="middle">Wi-Fi + firewall + switch</text><line x1="300" y1="240" x2="300" y2="290" stroke="#0a0a0a" stroke-width="2"/><rect x="80" y="290" width="440" height="70" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="2" stroke-dasharray="6 5"/><text x="300" y="322" font-size="16" fill="#0a0a0a" font-weight="700" text-anchor="middle">One network for everything</text><text x="300" y="344" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">Staff, guests, cameras, POS, TVs</text><circle cx="86" cy="394" r="9" fill="#fbeaea" stroke="#b91c1c" stroke-width="1.5"/><text x="86" y="399" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="middle">✕</text><text x="104" y="399" font-size="14" fill="#0a0a0a" font-weight="400" text-anchor="start">Dead zones far from the router</text><circle cx="86" cy="420" r="9" fill="#fbeaea" stroke="#b91c1c" stroke-width="1.5"/><text x="86" y="425" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="middle">✕</text><text x="104" y="425" font-size="14" fill="#0a0a0a" font-weight="400" text-anchor="start">Slows down when it gets busy</text><circle cx="86" cy="446" r="9" fill="#fbeaea" stroke="#b91c1c" stroke-width="1.5"/><text x="86" y="451" font-size="11" fill="#b91c1c" font-weight="700" text-anchor="middle">✕</text><text x="104" y="451" font-size="14" fill="#0a0a0a" font-weight="400" text-anchor="start">No one knows the admin password</text><line x1="580" y1="290" x2="620" y2="290" stroke="#0a0a0a" stroke-width="2.5" marker-end="url(#aI)"/><rect x="640" y="110" width="520" height="360" rx="14" fill="#f5f6f8" stroke="#d9dce1" stroke-width="1.5"/><text x="664" y="146" font-size="20" fill="#0a0a0a" font-weight="700" text-anchor="start">After</text><g class="rise" style="animation-delay:0.20s"><rect x="800" y="172" width="200" height="44" rx="10" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/><text x="900" y="200" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">Business gateway</text></g><g class="rise" style="animation-delay:0.45s"><line x1="900" y1="216" x2="900" y2="236" stroke="#0a0a0a" stroke-width="2"/><rect x="800" y="236" width="200" height="40" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/><text x="900" y="262" font-size="15" fill="#0a0a0a" font-weight="700" text-anchor="middle">PoE switch</text></g><g class="rise" style="animation-delay:0.70s"><line x1="900" y1="276" x2="900" y2="292" stroke="#0a0a0a" stroke-width="2"/><line x1="726" y1="292" x2="1074" y2="292" stroke="#0a0a0a" stroke-width="2"/><line x1="726" y1="292" x2="726" y2="306" stroke="#0a0a0a" stroke-width="2"/><circle cx="726" cy="320" r="14" fill="#1d4ed8"/><circle cx="726" cy="320" r="5" fill="#ffffff"/><line x1="842" y1="292" x2="842" y2="306" stroke="#0a0a0a" stroke-width="2"/><circle cx="842" cy="320" r="14" fill="#1d4ed8"/><circle cx="842" cy="320" r="5" fill="#ffffff"/><line x1="958" y1="292" x2="958" y2="306" stroke="#0a0a0a" stroke-width="2"/><circle cx="958" cy="320" r="14" fill="#1d4ed8"/><circle cx="958" cy="320" r="5" fill="#ffffff"/><line x1="1074" y1="292" x2="1074" y2="306" stroke="#0a0a0a" stroke-width="2"/><rect x="1040" y="306" width="68" height="28" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/><text x="1074" y="325" font-size="12" fill="#0a0a0a" font-weight="700" text-anchor="middle">Cams</text><text x="842" y="352" font-size="13" fill="#5f6368" font-weight="400" text-anchor="middle">Access points for full coverage</text></g><g class="pop" style="animation-delay:1.00s"><rect x="680" y="372" width="140" height="34" rx="17" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5"/><text x="750" y="394" font-size="13" fill="#1d4ed8" font-weight="700" text-anchor="middle">Staff network</text></g><g class="pop" style="animation-delay:1.12s"><rect x="840" y="372" width="140" height="34" rx="17" fill="#e7f5ec" stroke="#15803d" stroke-width="1.5"/><text x="910" y="394" font-size="13" fill="#15803d" font-weight="700" text-anchor="middle">Guest network</text></g><g class="pop" style="animation-delay:1.24s"><rect x="1000" y="372" width="140" height="34" rx="17" fill="#fdf3e4" stroke="#b45309" stroke-width="1.5"/><text x="1070" y="394" font-size="13" fill="#b45309" font-weight="700" text-anchor="middle">Devices network</text></g><text x="900" y="440" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">No monthly license fees with UniFi</text>
</svg>
