<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 835.8" width="640" height="835.8" role="img" aria-label="UniFi installation cost ranges: small home $600-$1,200, larger home $1,300-$2,400, small office $1,500-$3,600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>UniFi installation cost ranges: small home $600-$1,200, larger home $1,300-$2,400, small office $1,500-$3,600</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.grow{animation:grow 1s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}
.flow{stroke-dasharray:10 8;animation:flow .9s linear infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.8s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.04)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="640" height="835.8" fill="#ffffff"/>
<text x="32" y="58" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">What UniFi installation costs,</text><text x="32" y="98.8" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">all-in</text><text x="32" y="145.6" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">Hardware plus professional setup. No monthly</text><text x="32" y="175.3" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">license afterwards.</text><line x1="32.0" y1="219.0" x2="32.0" y2="697.0" stroke="#eceef1" stroke-width="2"/><text x="32.0" y="723.0" font-size="20" fill="#5f6368" font-weight="400" text-anchor="start">$0</text><line x1="176.0" y1="219.0" x2="176.0" y2="697.0" stroke="#eceef1" stroke-width="2"/><text x="176.0" y="723.0" font-size="20" fill="#5f6368" font-weight="400" text-anchor="middle">$1k</text><line x1="320.0" y1="219.0" x2="320.0" y2="697.0" stroke="#eceef1" stroke-width="2"/><text x="320.0" y="723.0" font-size="20" fill="#5f6368" font-weight="400" text-anchor="middle">$2k</text><line x1="464.0" y1="219.0" x2="464.0" y2="697.0" stroke="#eceef1" stroke-width="2"/><text x="464.0" y="723.0" font-size="20" fill="#5f6368" font-weight="400" text-anchor="middle">$3k</text><line x1="608.0" y1="219.0" x2="608.0" y2="697.0" stroke="#eceef1" stroke-width="2"/><text x="608.0" y="723.0" font-size="20" fill="#5f6368" font-weight="400" text-anchor="end">$4k</text><text x="32" y="255.0" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">Small home or apartment</text><text x="32" y="287.0" font-size="21" fill="#5f6368" font-weight="400" text-anchor="start">1 gateway, 1–2 APs</text><g class="grow" style="animation-delay:0.20s"><rect x="118.39999999999999" y="305.0" width="86.39999999999999" height="50" rx="25" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2.5"/></g><g class="rise" style="animation-delay:0.90s"><text x="216.79999999999998" y="339.0" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="start">$600–$1,200</text></g><text x="32" y="415.0" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">Larger home</text><text x="32" y="447.0" font-size="21" fill="#5f6368" font-weight="400" text-anchor="start">Gateway, PoE switch, 3–4 APs</text><g class="grow" style="animation-delay:0.45s"><rect x="219.20000000000002" y="465.0" width="158.39999999999995" height="50" rx="25" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2.5"/></g><g class="rise" style="animation-delay:1.15s"><text x="389.59999999999997" y="499.0" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="start">$1,300–$2,400</text></g><text x="32" y="575.0" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">Small office</text><text x="32" y="607.0" font-size="21" fill="#5f6368" font-weight="400" text-anchor="start">10–25 people, 3–5 APs</text><g class="grow" style="animation-delay:0.70s"><rect x="248.0" y="625.0" width="302.4" height="50" rx="25" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2.5"/></g><g class="rise" style="animation-delay:1.40s"><text x="399.2" y="659.0" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="middle">$1,500–$3,600</text></g><text x="32" y="773.0" font-size="21" fill="#5f6368" font-weight="400" text-anchor="start">Small office excludes new cable runs. Check</text><text x="32" y="802.4" font-size="21" fill="#5f6368" font-weight="400" text-anchor="start">store.ui.com for current hardware prices.</text>
</svg>
