<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 929.8999999999999" width="640" height="929.8999999999999" role="img" aria-label="Sonos across UniFi VLANs: mDNS proxy for discovery, allow Trusted to Sonos, and allow Sonos to Trusted on TCP 3400, 3401 and 3500" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Sonos across UniFi VLANs: mDNS proxy for discovery, allow Trusted to Sonos, and allow Sonos to Trusted on TCP 3400, 3401 and 3500</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.grow{animation:grow 1s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}
.flow{stroke-dasharray:10 8;animation:flow .9s linear infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.8s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.04)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="640" height="929.8999999999999" fill="#ffffff"/>
<text x="32" y="58" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">Sonos on an IoT VLAN</text><text x="32" y="104.8" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">Phones on Trusted, speakers on IoT. Most setups</text><text x="32" y="134.5" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">miss step 3.</text><defs><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs><rect x="32" y="178.2" width="576" height="120" rx="14" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2.5"/><text x="54" y="218.2" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="start">Trusted VLAN</text><text x="54" y="264.2" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">Sonos app on your phone</text><line x1="72" y1="302.2" x2="72" y2="688.3" stroke="#15803d" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#aG)" class="flow"/><line x1="112" y1="302.2" x2="112" y2="688.3" stroke="#1d4ed8" stroke-width="4" marker-end="url(#aB)" class="flow"/><line x1="152" y1="690.3" x2="152" y2="304.2" stroke="#b45309" stroke-width="4" marker-end="url(#aA)" class="flow"/><circle cx="210" cy="334.2" r="18" fill="#15803d"/><text x="210" y="342.2" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="242" y="342.2" font-size="23" fill="#15803d" font-weight="700" text-anchor="start">Discovery: turn on Gateway</text><text x="242" y="372.09999999999997" font-size="23" fill="#15803d" font-weight="700" text-anchor="start">mDNS Proxy for both VLANs</text><circle cx="210" cy="435.99999999999994" r="18" fill="#1d4ed8"/><text x="210" y="443.99999999999994" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="242" y="443.99999999999994" font-size="23" fill="#1d4ed8" font-weight="700" text-anchor="start">Allow Trusted → Sonos</text><text x="242" y="473.8999999999999" font-size="23" fill="#1d4ed8" font-weight="700" text-anchor="start">speakers</text><circle cx="210" cy="537.8" r="18" fill="#b45309"/><text x="210" y="545.8" font-size="22" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="242" y="545.8" font-size="23" fill="#b45309" font-weight="700" text-anchor="start">Allow Sonos → Trusted on TCP</text><text x="242" y="575.6999999999999" font-size="23" fill="#b45309" font-weight="700" text-anchor="start">3400, 3401, 3500</text><text x="242" y="609.5999999999999" font-size="21" fill="#5f6368" font-weight="400" text-anchor="start">Skip this and music plays, but</text><text x="242" y="637.9499999999999" font-size="21" fill="#5f6368" font-weight="400" text-anchor="start">the app never updates.</text><rect x="32" y="694.3" width="576" height="120" rx="14" fill="#fdf3e4" stroke="#b45309" stroke-width="2.5"/><text x="54" y="734.3" font-size="22" fill="#b45309" font-weight="700" text-anchor="start">IoT VLAN</text><text x="54" y="780.3" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">Sonos speakers (fixed IPs)</text><text x="32" y="864.3" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">Limit these rules to your Sonos devices instead</text><text x="32" y="895.0999999999999" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">of opening the whole IoT zone.</text>
</svg>
