<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="UniFi VLAN layout: Management VLAN 1, Trusted VLAN 10, IoT VLAN 20, Guest VLAN 30, Cameras VLAN 40" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>UniFi VLAN layout: Management VLAN 1, Trusted VLAN 10, IoT VLAN 20, Guest VLAN 30, Cameras VLAN 40</title>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="40" y="52" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">A typical UniFi VLAN layout</text><text x="40" y="80" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">One gateway, one switch, five networks. The subnet's third number matches the VLAN ID.</text><rect x="500" y="110" width="200" height="56" rx="10" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/><text x="600" y="145" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">UniFi Gateway</text><line x1="600" y1="166" x2="600" y2="200" stroke="#0a0a0a" stroke-width="2"/><rect x="500" y="200" width="200" height="50" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/><text x="600" y="231" font-size="16" fill="#0a0a0a" font-weight="600" text-anchor="middle">Switch + APs</text><line x1="600" y1="250" x2="600" y2="280" stroke="#0a0a0a" stroke-width="2"/><line x1="146" y1="280" x2="1082" y2="280" stroke="#0a0a0a" stroke-width="2"/><line x1="146.0" y1="280" x2="146.0" y2="316" stroke="#0a0a0a" stroke-width="2"/><rect x="40" y="316" width="212" height="200" rx="12" fill="#f5f6f8" stroke="#0a0a0a" stroke-width="2"/><rect x="40" y="316" width="212" height="8" rx="4" fill="#0a0a0a"/><text x="60" y="362" font-size="21" fill="#0a0a0a" font-weight="700" text-anchor="start">Management</text><text x="60" y="390" font-size="15" fill="#0a0a0a" font-weight="700" text-anchor="start">VLAN 1 (untagged)</text><text x="60" y="416" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">192.168.1.0/24</text><text x="60" y="460" font-size="15" fill="#0a0a0a" font-weight="400" text-anchor="start">Gateway, switches,</text><text x="60" y="482" font-size="15" fill="#0a0a0a" font-weight="400" text-anchor="start">access points</text><line x1="380.0" y1="280" x2="380.0" y2="316" stroke="#0a0a0a" stroke-width="2"/><rect x="274" y="316" width="212" height="200" rx="12" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/><rect x="274" y="316" width="212" height="8" rx="4" fill="#1d4ed8"/><text x="294" y="362" font-size="21" fill="#0a0a0a" font-weight="700" text-anchor="start">Trusted</text><text x="294" y="390" font-size="15" fill="#1d4ed8" font-weight="700" text-anchor="start">VLAN 10</text><text x="294" y="416" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">192.168.10.0/24</text><text x="294" y="460" font-size="15" fill="#0a0a0a" font-weight="400" text-anchor="start">Laptops, desktops,</text><text x="294" y="482" font-size="15" fill="#0a0a0a" font-weight="400" text-anchor="start">your phones</text><line x1="614.0" y1="280" x2="614.0" y2="316" stroke="#0a0a0a" stroke-width="2"/><rect x="508" y="316" width="212" height="200" rx="12" fill="#fdf3e4" stroke="#b45309" stroke-width="2"/><rect x="508" y="316" width="212" height="8" rx="4" fill="#b45309"/><text x="528" y="362" font-size="21" fill="#0a0a0a" font-weight="700" text-anchor="start">IoT</text><text x="528" y="390" font-size="15" fill="#b45309" font-weight="700" text-anchor="start">VLAN 20</text><text x="528" y="416" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">192.168.20.0/24</text><text x="528" y="460" font-size="15" fill="#0a0a0a" font-weight="400" text-anchor="start">TVs, speakers,</text><text x="528" y="482" font-size="15" fill="#0a0a0a" font-weight="400" text-anchor="start">thermostats, plugs</text><line x1="848.0" y1="280" x2="848.0" y2="316" stroke="#0a0a0a" stroke-width="2"/><rect x="742" y="316" width="212" height="200" rx="12" fill="#e7f5ec" stroke="#15803d" stroke-width="2"/><rect x="742" y="316" width="212" height="8" rx="4" fill="#15803d"/><text x="762" y="362" font-size="21" fill="#0a0a0a" font-weight="700" text-anchor="start">Guest</text><text x="762" y="390" font-size="15" fill="#15803d" font-weight="700" text-anchor="start">VLAN 30</text><text x="762" y="416" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">192.168.30.0/24</text><text x="762" y="460" font-size="15" fill="#0a0a0a" font-weight="400" text-anchor="start">Visitors.</text><text x="762" y="482" font-size="15" fill="#0a0a0a" font-weight="400" text-anchor="start">Internet only</text><line x1="1082.0" y1="280" x2="1082.0" y2="316" stroke="#0a0a0a" stroke-width="2"/><rect x="976" y="316" width="212" height="200" rx="12" fill="#fbeaea" stroke="#b91c1c" stroke-width="2"/><rect x="976" y="316" width="212" height="8" rx="4" fill="#b91c1c"/><text x="996" y="362" font-size="21" fill="#0a0a0a" font-weight="700" text-anchor="start">Cameras</text><text x="996" y="390" font-size="15" fill="#b91c1c" font-weight="700" text-anchor="start">VLAN 40</text><text x="996" y="416" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">192.168.40.0/24</text><text x="996" y="460" font-size="15" fill="#0a0a0a" font-weight="400" text-anchor="start">Cameras and NVR,</text><text x="996" y="482" font-size="15" fill="#0a0a0a" font-weight="400" text-anchor="start">no internet</text>
</svg>
