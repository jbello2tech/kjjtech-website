<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="UniFi Protect layout: cameras are powered by a PoE switch on their own camera network, record locally to a UniFi console with a hard drive, and you view them from the Protect app" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>UniFi Protect layout: cameras are powered by a PoE switch on their own camera network, record locally to a UniFi console with a hard drive, and you view them from the Protect app</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1s linear infinite}
.drift{animation:drift 9s ease-in-out infinite alternate}
.drift2{animation:drift 12s ease-in-out infinite alternate-reverse}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pkt{display:none}}
</style>
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.07"/></filter>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1.2" fill="#e6e6e6"/></pattern>
</defs>
<rect width="1200" height="590" fill="#ffffff"/>
<text x="40.0" y="52.0" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">How a UniFi Protect system fits together</text><text x="40.0" y="80.0" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Cameras get power and data over one cable, record to a drive on site, and you watch from the app.</text><rect x="24" y="128" width="330" height="400" rx="20" fill="#f9f9f9" stroke="#ececec"/><rect x="24" y="128" width="330" height="400" rx="20" fill="url(#dots)"/><text x="44.0" y="156.0" font-size="13" fill="#5f6368" font-weight="600" text-anchor="start" letter-spacing="2.2">CAMERA NETWORK (VLAN)</text><path id="p1" d="M205 205 C300 205 300 325 395 325" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="4" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="0.00s"/><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><path id="p2" d="M205 325 C300 325 300 325 395 325" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="4" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="0.50s"/><animateMotion dur="1.6s" begin="0.50s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><path id="p3" d="M205 445 C300 445 300 325 395 325" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="4" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="1.00s"/><animateMotion dur="1.6s" begin="1.00s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><g class="rise" style="animation-delay:0.10s"><rect x="45.0" y="159.0" width="170" height="92" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(112.6,171.0) scale(1.45)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><rect x="2" y="4.5" width="15.5" height="7.5" rx="2.2"/><path d="M17.5 6h2.7a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1h-2.7"/><circle cx="5.2" cy="8.25" r="0.9" fill="currentColor"/><path d="M9.5 12v3.5H6.5v4"/><path d="M3.5 19.5h6"/></g><text x="130.0" y="230.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">Front door</text></g><g class="rise" style="animation-delay:0.20s"><rect x="45.0" y="279.0" width="170" height="92" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(112.6,291.0) scale(1.45)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><rect x="2" y="4.5" width="15.5" height="7.5" rx="2.2"/><path d="M17.5 6h2.7a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1h-2.7"/><circle cx="5.2" cy="8.25" r="0.9" fill="currentColor"/><path d="M9.5 12v3.5H6.5v4"/><path d="M3.5 19.5h6"/></g><text x="130.0" y="350.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">Driveway</text></g><g class="rise" style="animation-delay:0.30s"><rect x="45.0" y="399.0" width="170" height="92" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(112.6,411.0) scale(1.45)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><rect x="2" y="4.5" width="15.5" height="7.5" rx="2.2"/><path d="M17.5 6h2.7a1 1 0 0 1 1 1v3.5a1 1 0 0 1-1 1h-2.7"/><circle cx="5.2" cy="8.25" r="0.9" fill="currentColor"/><path d="M9.5 12v3.5H6.5v4"/><path d="M3.5 19.5h6"/></g><text x="130.0" y="470.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">Back yard</text></g><g class="rise" style="animation-delay:0.35s"><rect x="395.0" y="269.0" width="150" height="112" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(452.6,281.0) scale(1.45)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round