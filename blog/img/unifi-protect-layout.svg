circle class="pkt" r="4" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="2.30s"/><animateMotion dur="2.6s" begin="2.30s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle><g class="rise" style="animation-delay:0.80s"><rect x="1015.0" y="139.0" width="150" height="112" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(1072.6,151.0) scale(1.45)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="10.5" y1="18" x2="13.5" y2="18"/></g><text x="1090.0" y="210.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">Protect app</text><text x="1090.0" y="230.3" font-size="13.5" fill="#5f6368" font-weight="400" text-anchor="middle">Live + playback</text></g><g class="pop" style="animation-delay:1.00s"><rect x="664.7" y="185.2" width="190.6" height="29.7" rx="14.9" fill="#e7f5ec" stroke="#15803d" stroke-width="1.5"/><text x="760.0" y="204.9" font-size="13.5" fill="#15803d" font-weight="700" text-anchor="middle">No monthly cloud fee</text></g><g class="pop" style="animation-delay:1.20s"><rect x="938.8" y="350.1" width="222.4" height="29.7" rx="14.9" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5"/><g transform="translate(952.8,356.0) scale(0.75)" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></g><text x="1062.0" y="369.9" font-size="13.5" fill="#1d4ed8" font-weight="700" text-anchor="middle">Encrypted remote view</text></g>
