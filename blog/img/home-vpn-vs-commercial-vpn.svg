<rect width="1200" height="640" fill="#ffffff"/>
<text x="40.0" y="52.0" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">Where your traffic exits is the IP the world sees</text><text x="40.0" y="80.0" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Both are encrypted. The difference is the last hop: a shared data center, or your own home internet connection.</text><rect x="24" y="113" width="1152" height="240" rx="20" fill="#f9f9f9" stroke="#ececec"/><rect x="24" y="113" width="1152" height="240" rx="20" fill="url(#dots)"/><text x="44.0" y="141.0" font-size="13" fill="#5f6368" font-weight="600" text-anchor="start" letter-spacing="2.2">COMMERCIAL VPN APP</text><g transform="translate(404.0,118.7) scale(10.5)"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="#ffffff" fill-opacity="0.85" stroke="#c4c4c4" stroke-width="1.5" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/></g><text x="538.4" y="299.3" font-size="12.5" fill="#5f6368" font-weight="600" text-anchor="middle" letter-spacing="2.4">INTERNET</text><path d="M180 245 L715 245" fill="none" stroke="#b91c1c" stroke-opacity="0.10" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path id="p1" d="M180 245 L715 245" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="10 8" class="flow" stroke-linecap="round" stroke-linejoin="round"/><circle class="pkt" r="4" fill="#b91c1c" opacity="0"><set attributeName="opacity" to="1" begin="0.00s"/><animateMotion dur="3.0s" begin="0.00s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><circle class="pkt" r="4" fill="#b91c1c" opacity="0"><set attributeName="opacity" to="1" begin="1.00s"/><animateMotion dur="3.0s" begin="1.00s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><circle class="pkt" r="4" fill="#b91c1c" opacity="0"><set attributeName="opacity" to="1" begin="2.00s"/><animateMotion dur="3.0s" begin="2.00s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><path id="p2" d="M865 245 L985 245" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="4" fill="#b91c1c" opacity="0"><set attributeName="opacity" to="1" begin="0.60s"/><animateMotion dur="1.6s" begin="0.60s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><g class="rise" style="animation-delay:0.10s"><rect x="30.0" y="189.0" width="150" height="112" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(87.6,201.0) scale(1.45)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M1 20h22"/></g><text x="105.0" y="260.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">Laptop</text><text x="105.0" y="280.3" font-size="13.5" fill="#5f6368" font-weight="400" text-anchor="middle">VPN app installed</text></g><g class="rise" style="animation-delay:0.30s"><rect x="715.0" y="189.0" width="150" height="112" rx="14" fill="#ffffff" stroke="#b91c1c" stroke-width="2" filter="url(#sh)"/><g transform="translate(772.6,201.0) scale(1.45)" fill="none" stroke="#b91c1c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#b91c1c"><rect x="2" y="3" width="20" height="7" rx="1.5"/><rect x="2" y="14" width="20" height="7" rx="1.5"/><circle cx="6" cy="6.5" r="1" fill="currentColor"/><circle cx="6" cy="17.5" r="1" fill="currentColor"/><path d="M11 6.5h7M11 17.5h7"/></g><text x="790.0" y="260.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">VPN provider</text><text x="790.0" y="280.3" font-size="13.5" fill="#5f6368" font-weight="400" text-anchor="middle">Shared data center</text></g><g class="rise" style="animation-delay:0.45s"><rect x="985.0" y="189.0" width="150" height="112" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(1042.6,201.0) scale(1.45)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></g><text x="1060.0" y="260.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">Bank / work app</text><text x="1060.0" y="280.3" font-size="13.5" fill="#5f6368" font-weight="400" text-anchor="middle">Sees provider IP</text></g><g class="pop" style="animation-delay:0.60s"><rect x="403.1" y="164.2" width="253.8" height="29.7" rx="14.9" fill="#fbeaea" stroke="#b91c1c" stroke-width="1.5"/><g transform="translate(417.1,170.0) scale(0.75)" fill="none" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></g><text x="542.0" y="183.9" font-size="13.5" fill="#b91c1c" font-weight="700" text-anchor="middle">Encrypted to the provider</text></g><g class="pop" style="animation-delay:0.90s"><rect x="949.0" y="312.1" width="221.9" height="29.7" rx="14.9" fill="#fbeaea" stroke="#b91c1c" stroke-width="1.5"/><text x="1060.0" y="331.9" font-size="13.5" fill="#b91c1c" font-weight="700" text-anchor="middle">Often flagged or blocked</text></g><rect x="24" y="373" width="1152" height="240" rx="20" fill="#f9f9f9" stroke="#ececec"/><rect x="24" y="373" width="1152" height="240" rx="20" fill="url(#dots)"/><text x="44.0" y="401.0" font-size="13" fill="#5f6368" font-weight="600" text-anchor="start" letter-spacing="2.2">HOME VPN: TUNNEL BACK TO YOUR OWN ROUTER</text><g transform="translate(404.0,378.7) scale(10.5)"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="#ffffff" fill-opacity="0.85" stroke="#c4c4c4" stroke-width="1.5" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/></g><text x="538.4" y="559.3" font-size="12.5" fill="#5f6368" font-weight="600" text-anchor="middle" le