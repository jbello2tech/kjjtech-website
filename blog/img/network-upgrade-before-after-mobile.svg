<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1175.0" width="640" height="1175.0" role="img" aria-label="Small business network before and after: an ISP router with one shared network versus a business gateway, PoE switch, access points and separate staff, guest and device networks" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Small business network before and after: an ISP router with one shared network versus a business gateway, PoE switch, access points and separate staff, guest and device networks</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.grow{animation:grow 1s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}
.flow{stroke-dasharray:10 8;animation:flow .9s linear infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.8s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.04)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="640" height="1175.0" fill="#ffffff"/>
<text x="32" y="58" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">What a network upgrade looks</text><text x="32" y="98.8" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">like</text><text x="32" y="145.6" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">From one ISP box doing everything to a setup</text><text x="32" y="175.3" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">built for the business.</text><defs><marker id="aI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a0a0a"/></marker></defs><rect x="32" y="219.0" width="576" height="400" rx="16" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="56" y="265.0" font-size="28" fill="#0a0a0a" font-weight="700" text-anchor="start">Before</text><rect x="170.0" y="291.0" width="300" height="80" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="2.5"/><text x="320.0" y="327.0" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="middle">ISP router</text><text x="320.0" y="357.0" font-size="20" fill="#5f6368" font-weight="400" text-anchor="middle">Wi-Fi + firewall + switch</text><line x1="320.0" y1="371.0" x2="320.0" y2="399.0" stroke="#0a0a0a" stroke-width="3"/><rect x="52" y="399.0" width="536" height="84" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="2.5" stroke-dasharray="8 6"/><text x="320.0" y="435.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">One network for everything</text><text x="320.0" y="465.0" font-size="20" fill="#5f6368" font-weight="400" text-anchor="middle">Staff, guests, cameras, POS, TVs</text><circle cx="72" cy="515.0" r="12" fill="#fbeaea" stroke="#b91c1c" stroke-width="2"/><text x="72" y="522.0" font-size="15" fill="#b91c1c" font-weight="700" text-anchor="middle">✕</text><text x="96" y="523.0" font-size="22" fill="#0a0a0a" font-weight="400" text-anchor="start">Dead zones far from the router</text><circle cx="72" cy="549.0" r="12" fill="#fbeaea" stroke="#b91c1c" stroke-width="2"/><text x="72" y="556.0" font-size="15" fill="#b91c1c" font-weight="700" text-anchor="middle">✕</text><text x="96" y="557.0" font-size="22" fill="#0a0a0a" font-weight="400" text-anchor="start">Slows down when it gets busy</text><circle cx="72" cy="583.0" r="12" fill="#fbeaea" stroke="#b91c1c" stroke-width="2"/><text x="72" y="590.0" font-size="15" fill="#b91c1c" font-weight="700" text-anchor="middle">✕</text><text x="96" y="591.0" font-size="22" fill="#0a0a0a" font-weight="400" text-anchor="start">No one knows the admin password</text><line x1="320.0" y1="629.0" x2="320.0" y2="673.0" stroke="#0a0a0a" stroke-width="4" marker-end="url(#aI)"/><rect x="32" y="685.0" width="576" height="470" rx="16" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="56" y="731.0" font-size="28" fill="#0a0a0a" font-weight="700" text-anchor="start">After</text><g class="rise" style="animation-delay:0.20s"><rect x="170.0" y="755.0" width="300" height="60" rx="12" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="2"/><text x="320.0" y="794.0" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">Business gateway</text></g><g class="rise" style="animation-delay:0.45s"><line x1="320.0" y1="815.0" x2="320.0" y2="839.0" stroke="#0a0a0a" stroke-width="3"/><rect x="170.0" y="839.0" width="300" height="56" rx="12" fill="#ffffff" stroke="#0a0a0a" stroke-width="2.5"/><text x="320.0" y="875.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">PoE switch</text></g><g class="rise" style="animation-delay:0.70s"><line x1="320.0" y1="895.0" x2="320.0" y2="919.0" stroke="#0a0a0a" stroke-width="3"/><line x1="112" y1="919.0" x2="502" y2="919.0" stroke="#0a0a0a" stroke-width="3"/><line x1="112" y1="919.0" x2="112" y2="935.0" stroke="#0a0a0a" stroke-width="3"/><rect x="67" y="935.0" width="90" height="40" rx="8" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/><text x="112" y="962.0" font-size="20" fill="#1d4ed8" font-weight="700" text-anchor="middle">AP</text><line x1="232" y1="919.0" x2="232" y2="935.0" stroke="#0a0a0a" stroke-width="3"/><rect x="187" y="935.0" width="90" height="40" rx="8" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/><text x="232" y="962.0" font-size="20" fill="#1d4ed8" font-weight="700" text-anchor="middle">AP</text><line x1="352" y1="919.0" x2="352" y2="935.0" stroke="#0a0a0a" stroke-width="3"/><rect x="307" y="935.0" width="90" height="40" rx="8" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/><text x="352" y="962.0" font-size="20" fill="#1d4ed8" font-weight="700" text-anchor="middle">AP</text><line x1="502" y1="919.0" x2="502" y2="935.0" stroke="#0a0a0a" stroke-width="3"/><rect x="452" y="935.0" width="100" height="40" rx="8" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/><text x="502" y="962.0" font-size="20" fill="#0a0a0a" font-weight="700" text-anchor="middle">Cams</text></g><g class="pop" style="animation-delay:1.00s"><rect x="52.0" y="1037.0" width="170.66666666666666" height="48" rx="24" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/><text x="137.33333333333331" y="1069.0" font-size="22" fill="#1d4ed8" font-weight="700" text-anchor="middle">Staff</text></g><g class="pop" style="animation-delay:1.12s"><rect x="234.66666666666666" y="1037.0" width="170.66666666666666" height="48" rx="24" fill="#e7f5ec" stroke="#15803d" stroke-width="2"/><text x="320.0" y="1069.0" font-size="22" fill="#15803d" font-weight="700" text-anchor="middle">Guest</text></g><g class="pop" style="animation-delay:1.24s"><rect x="417.3333333333333" y="1037.0" width="170.66666666666666" height="48" rx="24" fill="#fdf3e4" stroke="#b45309" stroke-width="2"/><text x="502.66666666666663" y="1069.0" font-size="22" fill="#b45309" font-weight="700" text-anchor="middle">Devices</text></g><text x="320.0" y="1129.0" font-size="21" fill="#5f6368" font-weight="400" text-anchor="middle">Separate networks, no license fees</text>
</svg>
