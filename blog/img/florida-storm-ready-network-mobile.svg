<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1474" width="640" height="1474" role="img" aria-label="Storm-ready network: surge protection and a battery backup keep the modem, gateway and switch powered, and a 5G backup takes over automatically when the main internet line goes down" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Storm-ready network: surge protection and a battery backup keep the modem, gateway and switch powered, and a 5G backup takes over automatically when the main internet line goes down</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1s linear infinite}
.drift{animation:drift 9s ease-in-out infinite alternate}
.drift2{animation:drift 12s ease-in-out infinite alternate-reverse}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pkt{display:none}}
</style>
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.07"/></filter>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1.2" fill="#e6e6e6"/></pattern>
</defs>
<rect width="640" height="1474" fill="#ffffff"/>
<text x="32.0" y="58.0" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">A network that rides out</text><text x="32.0" y="99.0" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">Florida storms</text><text x="32.0" y="144.0" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">Battery backup covers flickers and short</text><text x="32.0" y="174.0" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">outages. 5G backup covers a dead internet</text><text x="32.0" y="204.0" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">line.</text><g class="rise" style="animation-delay:0.10s"><rect x="170.0" y="281.0" width="300" height="106" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(299.0,295.0) scale(1.75)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><path d="M9 2v6M15 2v6"/><path d="M6 8h12v4a6 6 0 0 1-12 0z"/><path d="M12 18v4"/></g><text x="320.0" y="371.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">Wall power</text></g><path id="p1" d="M320 387 L320 441" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="5.5" fill="#b45309" opacity="0"><set attributeName="opacity" to="1" begin="0.00s"/><animateMotion dur="1.0s" begin="0.00s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><g class="rise" style="animation-delay:0.20s"><rect x="170.0" y="441.0" width="300" height="106" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(299.0,455.0) scale(1.75)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></g><text x="320.0" y="531.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">Surge protector</text></g><path id="p2" d="M320 547 L320 588" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="5.5" fill="#b45309" opacity="0"><set attributeName="opacity" to="1" begin="0.30s"/><animateMotion dur="1.0s" begin="0.30s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><g class="rise" style="animation-delay:0.30s"><rect x="170.0" y="588.0" width="300" height="132" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" filter="url(#sh)"/><g transform="translate(299.0,602.0) scale(1.75)" fill="none" stroke="#1d4ed8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#1d4ed8"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2"/><path d="M6 10v4M10 10v4"/></g><text x="320.0" y="678.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">UPS battery</text><text x="320.0" y="705.0" font-size="19" fill="#5f6368" font-weight="400" text-anchor="middle">Bridges outages</text></g><rect x="20" y="794" width="600" height="180" rx="20" fill="#f9f9f9" stroke="#ececec"/><rect x="20" y="794" width="600" height="180" rx="20" fill="url(#dots)"/><text x="40.0" y="828.0" font-size="22" fill="#5f6368" font-weight="600" text-anchor="start" letter-spacing="2.2">KEPT POWERED</text><path id="p3" d="M320 720 L320 764 L120 764 L120 831" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="5.5" fill="#b45309" opacity="0"><set attributeName="opacity" to="1" begin="0.60s"/><animateMotion dur="1.4s" begin="0.60s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><path id="p4" d="M320 720 L320 764 L320 764 L320 831" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="5.5" fill="#b45309" opacity="0"><set attributeName="opacity" to="1" begin="0.80s"/><animateMotion dur="1.4s" begin="0.80s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle><path id="p5" d="M320 720 L320 764 L520 764 L520 831" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="5.5" fill="#b45309" opacity="0"><set attributeName="opacity" to="1" begin="1.00s"/><animateMotion dur="1.4s" begin="1.00s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle><g class="rise" style="animation-delay:0.40s"><rect x="30.0" y="831.0" width="180" height="106" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(99.0,845.0) scale(1.75)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><rect x="1" y="6" width="22" height="12" rx="2"/><circle cx="6" cy="12" r="1.3" fill="currentColor"/><circle cx="10" cy="12" r="1.3" fill="currentColor"/><circle cx="14" cy="12" r="1.3" fill="currentColor"/><circle cx="18" cy="12" r="1.3" fill="currentColor"/></g><text x="120.0" y="921.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">Switch</text></g><g class="rise" style="animation-delay:0.50s"><rect x="230.0" y="831.0" width="180" height="106" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(299.0,845.0) scale(1.75)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></g><text x="320.0" y="921.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">Gateway</text></g><g class="rise" style="animation-delay:0.60s"><rect x="430.0" y="831.0" width="180" height="106" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(499.0,845.0) scale(1.75)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><rect x="3" y="9" width="18" height="11" rx="2"/><path d="M7 9V5M17 9V5"/><circle cx="8" cy="15" r="1" fill="currentColor"/><circle cx="12" cy="15" r="1" fill="currentColor"/></g><text x="520.0" y="921.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">Modem</text></g><g transform="translate(424.0,1033.2) scale(8)"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="#ffffff" fill-opacity="0.85" stroke="#c4c4c4" stroke-width="1.5" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/></g><text x="536.4" y="1170.8" font-size="17" fill="#5f6368" font-weight="600" text-anchor="middle" letter-spacing="2.4">INTERNET</text><path d="M520 937 L520 1074" fill="none" stroke="#1d4ed8" stroke-opacity="0.10" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path id="p6" d="M520 937 L520 1074" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="10 8" class="flow" stroke-linecap="round" stroke-linejoin="round"/><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="0.50s"/><animateMotion dur="2.4s" begin="0.50s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="1.30s"/><animateMotion dur="2.4s" begin="1.30s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="2.10s"/><animateMotion dur="2.4s" begin="2.10s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle><path id="p7" d="M320 937 C320 1044 200 1164 200 1258" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-dasharray="3 6" stroke-linecap="round"/><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="1.20s"/><animateMotion dur="1.8s" begin="1.20s" repeatCount="indefinite"><mpath href="#p7"/></animateMotion></circle><g class="rise" style="animation-delay:0.70s"><rect x="90.0" y="1258.0" width="320" height="132" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(229.0,1272.0) scale(1.75)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><circle cx="12" cy="9" r="1.6"/><path d="M12 11v11M8 22l4-11 4 11M9.5 19h5"/><path d="M8.2 5.2a5.4 5.4 0 0 0 0 7.6M15.8 5.2a5.4 5.4 0 0 1 0 7.6M5.4 2.4a9.4 9.4 0 0 0 0 13.2M18.6 2.4a9.4 9.4 0 0 1 0 13.2"/></g><text x="250.0" y="1348.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">5G backup</text><text x="250.0" y="1375.0" font-size="19" fill="#5f6368" font-weight="400" text-anchor="middle">Automatic failover</text></g><g class="pop" style="animation-delay:1.20s"><rect x="163.4" y="1402.0" width="173.2" height="44.0" rx="22.0" fill="#e7f5ec" stroke="#15803d" stroke-width="1.5"/><text x="250.0" y="1431.2" font-size="20" fill="#15803d" font-weight="700" text-anchor="middle">Stays online</text></g>
</svg>
