<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="UniFi installation cost ranges: small home $600-$1,200, larger home $1,300-$2,400, small office $1,500-$3,600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>UniFi installation cost ranges: small home $600-$1,200, larger home $1,300-$2,400, small office $1,500-$3,600</title>
<rect width="1200" height="470" fill="#ffffff"/>
<text x="40" y="52" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">What UniFi installation costs, all-in</text><text x="40" y="80" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Hardware plus professional setup. No monthly license afterwards.</text><line x1="330.0" y1="110" x2="330.0" y2="380" stroke="#eceef1" stroke-width="1.5"/><text x="330.0" y="404" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">$0</text><line x1="530.0" y1="110" x2="530.0" y2="380" stroke="#eceef1" stroke-width="1.5"/><text x="530.0" y="404" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">$1,000</text><line x1="730.0" y1="110" x2="730.0" y2="380" stroke="#eceef1" stroke-width="1.5"/><text x="730.0" y="404" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">$2,000</text><line x1="930.0" y1="110" x2="930.0" y2="380" stroke="#eceef1" stroke-width="1.5"/><text x="930.0" y="404" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">$3,000</text><line x1="1130.0" y1="110" x2="1130.0" y2="380" stroke="#eceef1" stroke-width="1.5"/><text x="1130.0" y="404" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">$4,000</text><text x="306" y="162" font-size="18" fill="#0a0a0a" font-weight="700" text-anchor="end">Small home or apartment</text><text x="306" y="184" font-size="14" fill="#5f6368" font-weight="400" text-anchor="end">1 gateway, 1–2 APs</text><rect x="450.0" y="146" width="120.0" height="40" rx="20" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/><text x="510.0" y="172" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="middle">$600–$1,200</text><text x="306" y="244" font-size="18" fill="#0a0a0a" font-weight="700" text-anchor="end">Larger home</text><text x="306" y="266" font-size="14" fill="#5f6368" font-weight="400" text-anchor="end">Gateway, PoE switch, 3–4 APs</text><rect x="590.0" y="228" width="220.0" height="40" rx="20" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/><text x="700.0" y="254" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="middle">$1,300–$2,400</text><text x="306" y="326" font-size="18" fill="#0a0a0a" font-weight="700" text-anchor="end">Small office</text><text x="306" y="348" font-size="14" fill="#5f6368" font-weight="400" text-anchor="end">10–25 people, 3–5 APs</text><rect x="630.0" y="310" width="420.0" height="40" rx="20" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/><text x="840.0" y="336" font-size="16" fill="#1d4ed8" font-weight="700" text-anchor="middle">$1,500–$3,600</text><text x="40" y="446" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">Small office range excludes new cable runs. Hardware prices change often; check store.ui.com for current pricing.</text>
</svg>
