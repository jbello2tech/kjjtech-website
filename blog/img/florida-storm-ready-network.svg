<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Storm-ready network: surge protection and a battery backup keep the modem, gateway and switch powered, and a 5G backup takes over automatically when the main internet line goes down" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Storm-ready network: surge protection and a battery backup keep the modem, gateway and switch powered, and a 5G backup takes over automatically when the main internet line goes down</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1s linear infinite}
.drift{animation:drift 9s ease-in-out infinite alternate}
.drift2{animation:drift 12s ease-in-out infinite alternate-reverse}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pkt{display:none}}
</style>
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.07"/></filter>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1.2" fill="#e6e6e6"/></pattern>
</defs>
<rect width="1200" height="600" fill="#ffffff"/>
<text x="40.0" y="52.0" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">A network that rides out Florida storms</text><text x="40.0" y="80.0" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Battery backup keeps the core gear on through flickers and short outages. 5G backup covers a dead internet line.</text><g class="drift"><g transform="translate(1024.0,102.2) scale(3.0)" opacity="0.55"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="none" fill-opacity="0.85" stroke="#c4c4c4" stroke-width="1.2" stroke-dasharray="none" vector-effect="non-scaling-stroke"/></g></g><rect x="24" y="128" width="640" height="380" rx="20" fill="#f9f9f9" stroke="#ececec"/><rect x="24" y="128" width="640" height="380" rx="20" fill="url(#dots)"/><text x="44.0" y="156.0" font-size="13" fill="#5f6368" font-weight="600" text-anchor="start" letter-spacing="2.2">YOUR NETWORK CLOSET</text><g class="rise" style="animation-delay:0.10s"><rect x="40.0" y="184.0" width="140" height="92" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(92.6,196.0) scale(1.45)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><path d="M9 2v6M15 2v6"/><path d="M6 8h12v4a6 6 0 0 1-12 0z"/><path d="M12 18v4"/></g><text x="110.0" y="255.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">Wall power</text></g><path id="p1" d="M180 230 L250 230" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="4" fill="#b45309" opacity="0"><set attributeName="opacity" to="1" begin="0.00s"/><animateMotion dur="1.0s" begin="0.00s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><g class="rise" style="animation-delay:0.20s"><rect x="245.0" y="184.0" width="150" height="92" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(302.6,196.0) scale(1.45)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></g><text x="320.0" y="255.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">Surge protector</text></g><path id="p2" d="M395 230 L465 230" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="4" fill="#b45309" opacity="0"><set attributeName="opacity" to="1" begin="0.30s"/><animateMotion dur="1.0s" begin="0.30s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><g class="rise" style="animation-delay:0.30s"><rect x="460.0" y="174.0" width="160" height="112" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" filter="url(#sh)"/><g transform="translate(522.6,186.0) scale(1.45)" fill="none" stroke="#1d4ed8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#1d4ed8"><rect x="2" y="7" width="18" height="10" rx="2"/><path d="M22 11v2"/><path d="M6 10v4M10 10v4"/></g><text x="540.0" y="245.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">UPS battery</text><text x="540.0" y="265.3" font-size="13.5" fill="#5f6368" font-weight="400" text-anchor="middle">Bridges outages</text></g><path id="p3" d="M540 286 L540 340 L150 340 L150 374" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="4" fill="#b45309" opacity="0"><set attributeName="opacity" to="1" begin="0.60s"/><animateMotion dur="1.4s" begin="0.60s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><path id="p4" d="M540 286 L540 340 L340 340 L340 374" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="4" fill="#b45309" opacity="0"><set attributeName="opacity" to="1" begin="0.80s"/><animateMotion dur="1.4s" begin="0.80s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle><path id="p5" d="M540 286 L540 340 L530 340 L530 374" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="4" fill="#b45309" opacity="0"><set attributeName="opacity" to="1" begin="1.00s"/><animateMotion dur="1.4s" begin="1.00s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle><g class="rise" style="animation-delay:0.40s"><rect x="70.0" y="374.0" width="160" height="92" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(132.6,386.0) scale(1.45)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><rect x="1" y="6" width="22" height="12" rx="2"/><circle cx="6" cy="12" r="1.3" fill="currentColor"/><circle cx="10" cy="12" r="1.3" fill="currentColor"/><circle cx="14" cy="12" r="1.3" fill="currentColor"/><circle cx="18" cy="12" r="1.3" fill="currentColor"/></g><text x="150.0" y="445.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">Switch</text></g><g class="rise" style="animation-delay:0.50s"><rect x="260.0" y="374.0" width="160" height="92" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(322.6,386.0) scale(1.45)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></g><text x="340.0" y="445.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">UniFi gateway</text></g><g class="rise" style="animation-delay:0.60s"><rect x="450.0" y="374.0" width="160" height="92" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(512.6,386.0) scale(1.45)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><rect x="3" y="9" width="18" height="11" rx="2"/><path d="M7 9V5M17 9V5"/><circle cx="8" cy="15" r="1" fill="currentColor"/><circle cx="12" cy="15" r="1" fill="currentColor"/></g><text x="530.0" y="445.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">Modem / ONT</text></g><g transform="translate(859.2,194.2) scale(8.4)"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="#ffffff" fill-opacity="0.85" stroke="#c4c4c4" stroke-width="1.5" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/></g><text x="966.7" y="338.6" font-size="12.5" fill="#5f6368" font-weight="600" text-anchor="middle" letter-spacing="2.4">INTERNET</text><path id="p6" d="M230 420 L260 420" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><path id="p7" d="M420 420 L450 420" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><path d="M610 420 C720 420 760 300 880 300" fill="none" stroke="#1d4ed8" stroke-opacity="0.10" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path id="p8" d="M610 420 C720 420 760 300 880 300" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="10 8" class="flow" stroke-linecap="round" stroke-linejoin="round"/><circle class="pkt" r="4" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="0.50s"/><animateMotion dur="2.6s" begin="0.50s" repeatCount="indefinite"><mpath href="#p8"/></animateMotion></circle><circle class="pkt" r="4" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="1.37s"/><animateMotion dur="2.6s" begin="1.37s" repeatCount="indefinite"><mpath href="#p8"/></animateMotion></circle><circle class="pkt" r="4" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="2.23s"/><animateMotion dur="2.6s" begin="2.23s" repeatCount="indefinite"><mpath href="#p8"/></animateMotion></circle><path id="p9" d="M340 466 C380 530 560 530 705 510" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-dasharray="3 6" stroke-linecap="round"/><circle class="pkt" r="4" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="1.20s"/><animateMotion dur="1.8s" begin="1.20s" repeatCount="indefinite"><mpath href="#p9"/></animateMotion></circle><path id="p10" d="M895 510 C960 510 980 400 970 370" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-dasharray="3 6" stroke-linecap="round"/><circle class="pkt" r="4" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="1.60s"/><animateMotion dur="1.8s" begin="1.60s" repeatCount="indefinite"><mpath href="#p10"/></animateMotion></circle><g class="rise" style="animation-delay:0.70s"><rect x="705.0" y="454.0" width="190" height="112" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(782.6,466.0) scale(1.45)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><circle cx="12" cy="9" r="1.6"/><path d="M12 11v11M8 22l4-11 4 11M9.5 19h5"/><path d="M8.2 5.2a5.4 5.4 0 0 0 0 7.6M15.8 5.2a5.4 5.4 0 0 1 0 7.6M5.4 2.4a9.4 9.4 0 0 0 0 13.2M18.6 2.4a9.4 9.4 0 0 1 0 13.2"/></g><text x="800.0" y="525.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">5G backup</text><text x="800.0" y="545.3" font-size="13.5" fill="#5f6368" font-weight="400" text-anchor="middle">Takes over automatically</text></g><g class="pop" style="animation-delay:0.90s"><rect x="630.1" y="281.1" width="229.8" height="29.7" rx="14.9" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5"/><text x="745.0" y="300.9" font-size="13.5" fill="#1d4ed8" font-weight="700" text-anchor="middle">Main line (fiber / cable)</text></g><g class="pop" style="animation-delay:1.20s"><rect x="896.0" y="155.2" width="128.0" height="29.7" rx="14.9" fill="#e7f5ec" stroke="#15803d" stroke-width="1.5"/><text x="960.0" y="174.9" font-size="13.5" fill="#15803d" font-weight="700" text-anchor="middle">Stays online</text></g>
