" to="1" begin="0.00s"/><animateMotion dur="3.2s" begin="0.00s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><circle class="pkt" r="4" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="1.07s"/><animateMotion dur="3.2s" begin="1.07s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><circle class="pkt" r="4" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="2.13s"/><animateMotion dur="3.2s" begin="2.13s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><g class="rise" style="animation-delay:0.35s"><rect x="455.0" y="244.0" width="130" height="112" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(502.6,256.0) scale(1.45)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><circle cx="12" cy="9" r="1.6"/><path d="M12 11v11M8 22l4-11 4 11M9.5 19h5"/><path d="M8.2 5.2a5.4 5.4 0 0 0 0 7.6M15.8 5.2a5.4 5.4 0 0 1 0 7.6M5.4 2.4a9.4 9.4 0 0 0 0 13.2M18.6 2.4a9.4 9.4 0 0 1 0 13.2"/></g><text x="520.0" y="315.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">5G / LTE</text><text x="520.0" y="335.3" font-size="13.5" fill="#5f6368" font-weight="400" text-anchor="middle">Cellular uplink</text></g><g class="pop" style="animation-delay:0.80s"><rect x="594.4" y="215.2" width="191.1" height="29.7" rx="14.9" fill="#e8eefc" stroke="#1d4ed8" stroke-width="1.5"/><g transform="translate(608.4,221.0) scale(0.75)" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></g><text x="702.0" y="234.9" font-size="13.5" fill="#1d4ed8" font-weight="700" text-anchor="middle">WireGuard over 5G</text></g><g class="rise" style="animation-delay:0.25s"><rect x="245.0" y="244.0" width="150" height="112" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" filter="url(#sh)"/><g transform="translate(302.6,256.0) scale(1.45)" fill="none" stroke="#1d4ed8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#1d4ed8"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8.5 11.2a5 5 0 0 1 7 0M10.3 13.4a2.4 2.4 0 0 1 3.4 0"/><circle cx="12" cy="16" r="0.9" fill="currentColor"/><path d="M8 2.5h8"/></g><text x="320.0" y="315.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">Mudi 7</text><text x="320.0" y="335.3" font-size="13.5" fill="#5f6368" font-weight="400" text-anchor="middle">5G + eSIM</text></g><g class="rise" style="animation-delay:0.50s"><rect x="825.0" y="244.0" width="150" height="112" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" filter="url(#sh)"/><g transform="translate(882.6,256.0) scale(1.45)" fill="none" stroke="#1d4ed8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#1d4ed8"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></g><text x="900.0" y="315.8" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">UniFi gateway</text><text x="900.0" y="335.3" font-size="13.5" fill="#5f6368" font-weight="400" text-anchor="middle">WireGuard server</text></g><path id="p4" d="M900 356 L900 408 L1100 408 L1100 356" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="4" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="1.00s"/><animateMotion dur="2.0s" begin="1.00s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle><g class="rise" style="animation-delay:0.65s"><rect x="1035.0" y="244.0" width="130" height="112" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(1082.6,256.0) scale(1.45)" fill="none" stroke="#0a0a0a" strok