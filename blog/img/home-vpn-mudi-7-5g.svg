<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img" aria-label="GL.iNet Mudi 7 on 5G: devices connect to the Mudi 7, which uses a cellular connection to tunnel back to your UniFi gateway at home, so websites see your home IP" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>GL.iNet Mudi 7 on 5G: devices connect to the Mudi 7, which uses a cellular connection to tunnel back to your UniFi gateway at home, so websites see your home IP</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1s linear infinite}
.drift{animation:drift 9s ease-in-out infinite alternate}
.drift2{animation:drift 12s ease-in-out infinite alternate-reverse}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pkt{display:none}}
</style>
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.07"/></filter>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1.2" fill="#e6e6e6"/></pattern>
</defs>
<rect width="1200" height="530" fill="#ffffff"/>
<text x="40.0" y="52.0" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">No hotel Wi-Fi? Use 5G</text><text x="40.0" y="80.0" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">The Mudi 7 has its own SIM / eSIM and battery, so the tunnel home works from a car, a park or an airport.</text><g class="drift"><g transform="translate(564.0,127.2) scale(3.0)" opacity="0.55"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="none" fill-opacity="0.85" stroke="#c4c4c4" stroke-width="1.2" stroke-dasharray="none" vector-effect="non-scaling-stroke"/></g></g><g class="drift2"><g transform="translate(441.2,399.8) scale(2.4)" opacity="0.55"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="none" fill-opacity="0.85" stroke="#c4c4c4" stroke-width="1.2" stroke-dasharray="none" vector-effect="non-scaling-stroke"/></g></g><rect x="24" y="128" width="400" height="340" rx="20" fill="#f9f9f9" stroke="#ececec"/><rect x="24" y="128" width="400" height="340" rx="20" fill="url(#dots)"/><text x="44.0" y="156.0" font-size="13" fill="#5f6368" font-weight="600" text-anchor="start" letter-spacing="2.2">ON THE ROAD</text><rect x="786" y="128" width="390" height="340" rx="20" fill="#f9f9f9" stroke="#ececec"/><rect x="786" y="128" width="390" height="340" rx="20" fill="url(#dots)"/><text x="806.0" y="156.0" font-size="13" fill="#5f6368" font-weight="600" text-anchor="start" letter-spacing="2.2">HOME</text><path id="p1" d="M180 222 C235 222 190 300 245 300" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-dasharray="3 6" stroke-linecap="round"/><circle class="pkt" r="4" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="0.00s"/><animateMotion dur="1.3s" begin="0.00s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><path id="p2" d="M180 392 C235 392 190 300 245 300" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-dasharray="3 6" stroke-linecap="round"/><circle class="pkt" r="4" fill="#1d4ed8" 