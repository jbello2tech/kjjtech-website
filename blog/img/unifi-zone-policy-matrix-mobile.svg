nt-weight="400" text-anchor="start">but IoT can’t reach Trusted, so a hacked smart</text><text x="32" y="566.0999999999999" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">plug can’t get to your laptop.</text>
