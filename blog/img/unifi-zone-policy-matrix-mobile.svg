<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600.8999999999999" width="640" height="600.8999999999999" role="img" aria-label="UniFi zone-based firewall policy matrix: Trusted, IoT, Guest and External zones with allow and block rules" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>UniFi zone-based firewall policy matrix: Trusted, IoT, Guest and External zones with allow and block rules</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.grow{animation:grow 1s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}
.flow{stroke-dasharray:10 8;animation:flow .9s linear infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.8s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.04)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="640" height="600.8999999999999" fill="#ffffff"/>
<text x="32" y="58" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">Zone policy matrix</text><text x="32" y="104.8" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">Read each row as “from this zone, to that zone.”</text><text x="36" y="178.5" font-size="20" fill="#5f6368" font-weight="700" text-anchor="start">From ↓</text><text x="36" y="204.5" font-size="20" fill="#5f6368" font-weight="700" text-anchor="start">To →</text><rect x="164.0" y="148.5" width="104.0" height="72" rx="10" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="216.0" y="193.5" font-size="21" fill="#0a0a0a" font-weight="700" text-anchor="middle">Trusted</text><rect x="276.0" y="148.5" width="104.0" height="72" rx="10" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="328.0" y="193.5" font-size="21" fill="#0a0a0a" font-weight="700" text-anchor="middle">IoT</text><rect x="388.0" y="148.5" width="104.0" height="72" rx="10" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="440.0" y="193.5" font-size="21" fill="#0a0a0a" font-weight="700" text-anchor="middle">Guest</text><rect x="500.0" y="148.5" width="104.0" height="72" rx="10" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="552.0" y="193.5" font-size="21" fill="#0a0a0a" font-weight="700" text-anchor="middle">Internet</text><rect x="32" y="232.5" width="120" height="72" rx="10" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="46" y="277.5" font-size="22" fill="#0a0a0a" font-weight="700" text-anchor="start">Trusted</text><g class="pop" style="animation-delay:0.20s"><rect x="164.0" y="232.5" width="104.0" height="72" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="2"/><text x="216.0" y="266.5" font-size="24" fill="#15803d" font-weight="700" text-anchor="middle">✓</text><text x="216.0" y="292.5" font-size="19" fill="#15803d" font-weight="700" text-anchor="middle">Allow</text></g><g class="pop" style="animation-delay:0.27s"><rect x="276.0" y="232.5" width="104.0" height="72" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="2"/><text x="328.0" y="266.5" font-size="24" fill="#15803d" font-weight="700" text-anchor="middle">✓</text><text x="328.0" y="292.5" font-size="19" fill="#15803d" font-weight="700" text-anchor="middle">Allow</text></g><g class="pop" style="animation-delay:0.34s"><rect x="388.0" y="232.5" width="104.0" height="72" rx="10" fill="#fbeaea" stroke="#b91c1c" stroke-width="2"/><text x="440.0" y="266.5" font-size="24" fill="#b91c1c" font-weight="700" text-anchor="middle">✕</text><text x="440.0" y="292.5" font-size="19" fill="#b91c1c" font-weight="700" text-anchor="middle">Block</text></g><g class="pop" style="animation-delay:0.41s"><rect x="500.0" y="232.5" width="104.0" height="72" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="2"/><text x="552.0" y="266.5" font-size="24" fill="#15803d" font-weight="700" text-anchor="middle">✓</text><text x="552.0" y="292.5" font-size="19" fill="#15803d" font-weight="700" text-anchor="middle">Allow</text></g><rect x="32" y="316.5" width="120" height="72" rx="10" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="46" y="361.5" font-size="22" fill="#0a0a0a" font-weight="700" text-anchor="start">IoT</text><g class="pop" style="animation-delay:0.45s"><rect x="164.0" y="316.5" width="104.0" height="72" rx="10" fill="#fbeaea" stroke="#b91c1c" stroke-width="2"/><text x="216.0" y="350.5" font-size="24" fill="#b91c1c" font-weight="700" text-anchor="middle">✕</text><text x="216.0" y="376.5" font-size="19" fill="#b91c1c" font-weight="700" text-anchor="middle">Block</text></g><g class="pop" style="animation-delay:0.52s"><rect x="276.0" y="316.5" width="104.0" height="72" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="2"/><text x="328.0" y="350.5" font-size="24" fill="#15803d" font-weight="700" text-anchor="middle">✓</text><text x="328.0" y="376.5" font-size="19" fill="#15803d" font-weight="700" text-anchor="middle">Allow</text></g><g class="pop" style="animation-delay:0.59s"><rect x="388.0" y="316.5" width="104.0" height="72" rx="10" fill="#fbeaea" stroke="#b91c1c" stroke-width="2"/><text x="440.0" y="350.5" font-size="24" fill="#b91c1c" font-weight="700" text-anchor="middle">✕</text><text x="440.0" y="376.5" font-size="19" fill="#b91c1c" font-weight="700" text-anchor="middle">Block</text></g><g class="pop" style="animation-delay:0.66s"><rect x="500.0" y="316.5" width="104.0" height="72" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="2"/><text x="552.0" y="350.5" font-size="24" fill="#15803d" font-weight="700" text-anchor="middle">✓</text><text x="552.0" y="376.5" font-size="19" fill="#15803d" font-weight="700" text-anchor="middle">Allow</text></g><rect x="32" y="400.5" width="120" height="72" rx="10" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="46" y="445.5" font-size="22" fill="#0a0a0a" font-weight="700" text-anchor="start">Guest</text><g class="pop" style="animation-delay:0.70s"><rect x="164.0" y="400.5" width="104.0" height="72" rx="10" fill="#fbeaea" stroke="#b91c1c" stroke-width="2"/><text x="216.0" y="434.5" font-size="24" fill="#b91c1c" font-weight="700" text-anchor="middle">✕</text><text x="216.0" y="460.5" font-size="19" fill="#b91c1c" font-weight="700" text-anchor="middle">Block</text></g><g class="pop" style="animation-delay:0.77s"><rect x="276.0" y="400.5" width="104.0" height="72" rx="10" fill="#fbeaea" stroke="#b91c1c" stroke-width="2"/><text x="328.0" y="434.5" font-size="24" fill="#b91c1c" font-weight="700" text-anchor="middle">✕</text><text x="328.0" y="460.5" font-size="19" fill="#b91c1c" font-weight="700" text-anchor="middle">Block</text></g><g class="pop" style="animation-delay:0.84s"><rect x="388.0" y="400.5" width="104.0" height="72" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="2"/><text x="440.0" y="434.5" font-size="24" fill="#15803d" font-weight="700" text-anchor="middle">✓</text><text x="440.0" y="460.5" font-size="19" fill="#15803d" font-weight="700" text-anchor="middle">Allow</text></g><g class="pop" style="animation-delay:0.91s"><rect x="500.0" y="400.5" width="104.0" height="72" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="2"/><text x="552.0" y="434.5" font-size="24" fill="#15803d" font-weight="700" text-anchor="middle">✓</text><text x="552.0" y="460.5" font-size="19" fill="#15803d" font-weight="700" text-anchor="middle">Allow</text></g><text x="32" y="504.5" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">Trusted can reach IoT to control smart devices,</text><text x="32" y="535.3" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">but IoT can’t reach Trusted, so a hacked smart</text><text x="32" y="566.0999999999999" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">plug can’t get to your laptop.</text>
</svg>
