" font-size="24" fill="#15803d" font-weight="700" text-anchor="middle">✓</text><text x="328.0" y="292.5" font-size="19" fill="#15803d" font-weight="700" text-anchor="middle">Allow</text><rect x="388.0" y="232.5" width="104.0" height="72" rx="10" fill="#fbeaea" stroke="#b91c1c" stroke-width="2"/><text x="440.0" y="266.5" font-size="24" fill="#b91c1c" font-weight="700" text-anchor="middle">✕</text><text x="440.0" y="292.5" font-size="19" fill="#b91c1c" font-weight="700" text-anchor="middle">Block</text><rect x="500.0" y="232.5" width="104.0" height="72" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="2"/><text x="552.0" y="266.5" font-size="24" fill="#15803d" font-weight="700" text-anchor="middle">✓</text><text x="552.0" y="292.5" font-size="19" fill="#15803d" font-weight="700" text-anchor="middle">Allow</text><rect x="32" y="316.5" width="120" height="72" rx="10" fill="#f5f6f8" stroke="#d9dce1" stroke-width="2"/><text x="46" y="361.5" font-size="22" fill="#0a0a0a" font-weight="700" text-anchor="start">IoT</text><rect x="164.0" y="316.5" width="104.0" height="72" rx="10" fill="#fbeaea" stroke="#b91c1c" stroke-width="2"/><text x="216.0" y="350.5" font-size="24" fill="#b91c1c" font-weight="700" text-anchor="middle">✕</text><text x="216.0" y="376.5" font-size="19" fill="#b91c1c" font-weight="700" text-anchor="middle">Block</text><rect x="276.0" y="316.5" width="104.0" height="72" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="2"/><text x="328.0" y="350.5" font-size="24" fill="#15803d" font-weight="700" text-anchor="middle">✓</text><text x="328.0" y="376.5" font-size="19" fill="#15803d" font-weight="700" text-anchor="middle">Allow</text><rect x="388.0" y="316.5" width="104.0" height="72" rx="10" fill="#fbeaea" stroke="#b91c1c" stroke-width="2"/><text x="440.0" y="350.5" font-size="24" fill="#b91c1c" font-weight="700" text-anchor="middle">✕</text><text x="440.0" y="376.5" font-size="19" fill="#b91c1c" font-weight="700" text-anchor="middle">Block</text><rect x=