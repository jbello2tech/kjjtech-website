<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="UniFi zone-based firewall policy matrix: Trusted, IoT, Guest and External zones with allow and block rules" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>UniFi zone-based firewall policy matrix: Trusted, IoT, Guest and External zones with allow and block rules</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.grow{animation:grow 1s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}
.flow{stroke-dasharray:10 8;animation:flow .9s linear infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.8s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.04)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="520" fill="#ffffff"/>
<text x="40" y="52" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">Zone policy matrix for a home or small office</text><text x="40" y="80" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Read each row as “from this zone, to that zone.”</text><text x="56" y="164" font-size="15" fill="#5f6368" font-weight="600" text-anchor="start">From ↓   To →</text><rect x="266" y="120" width="216" height="66" rx="10" fill="#f5f6f8" stroke="#d9dce1" stroke-width="1.5"/><text x="374.0" y="160" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">Trusted</text><rect x="494" y="120" width="216" height="66" rx="10" fill="#f5f6f8" stroke="#d9dce1" stroke-width="1.5"/><text x="602.0" y="160" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">IoT</text><rect x="722" y="120" width="216" height="66" rx="10" fill="#f5f6f8" stroke="#d9dce1" stroke-width="1.5"/><text x="830.0" y="160" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">Guest</text><rect x="950" y="120" width="216" height="66" rx="10" fill="#f5f6f8" stroke="#d9dce1" stroke-width="1.5"/><text x="1058.0" y="160" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="middle">External (internet)</text><rect x="46" y="198" width="208" height="66" rx="10" fill="#f5f6f8" stroke="#d9dce1" stroke-width="1.5"/><text x="66" y="238" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="start">Trusted</text><g class="pop" style="animation-delay:0.20s"><rect x="266" y="198" width="216" height="66" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="1.5"/><text x="374.0" y="239" font-size="18" fill="#15803d" font-weight="700" text-anchor="middle">✓  Allow</text></g><g class="pop" style="animation-delay:0.27s"><rect x="494" y="198" width="216" height="66" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="1.5"/><text x="602.0" y="239" font-size="18" fill="#15803d" font-weight="700" text-anchor="middle">✓  Allow</text></g><g class="pop" style="animation-delay:0.34s"><rect x="722" y="198" width="216" height="66" rx="10" fill="#fbeaea" stroke="#b91c1c" stroke-width="1.5"/><text x="830.0" y="239" font-size="18" fill="#b91c1c" font-weight="700" text-anchor="middle">✕  Block</text></g><g class="pop" style="animation-delay:0.41s"><rect x="950" y="198" width="216" height="66" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="1.5"/><text x="1058.0" y="239" font-size="18" fill="#15803d" font-weight="700" text-anchor="middle">✓  Allow</text></g><rect x="46" y="276" width="208" height="66" rx="10" fill="#f5f6f8" stroke="#d9dce1" stroke-width="1.5"/><text x="66" y="316" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="start">IoT</text><g class="pop" style="animation-delay:0.45s"><rect x="266" y="276" width="216" height="66" rx="10" fill="#fbeaea" stroke="#b91c1c" stroke-width="1.5"/><text x="374.0" y="317" font-size="18" fill="#b91c1c" font-weight="700" text-anchor="middle">✕  Block</text></g><g class="pop" style="animation-delay:0.52s"><rect x="494" y="276" width="216" height="66" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="1.5"/><text x="602.0" y="317" font-size="18" fill="#15803d" font-weight="700" text-anchor="middle">✓  Allow</text></g><g class="pop" style="animation-delay:0.59s"><rect x="722" y="276" width="216" height="66" rx="10" fill="#fbeaea" stroke="#b91c1c" stroke-width="1.5"/><text x="830.0" y="317" font-size="18" fill="#b91c1c" font-weight="700" text-anchor="middle">✕  Block</text></g><g class="pop" style="animation-delay:0.66s"><rect x="950" y="276" width="216" height="66" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="1.5"/><text x="1058.0" y="317" font-size="18" fill="#15803d" font-weight="700" text-anchor="middle">✓  Allow</text></g><rect x="46" y="354" width="208" height="66" rx="10" fill="#f5f6f8" stroke="#d9dce1" stroke-width="1.5"/><text x="66" y="394" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="start">Guest</text><g class="pop" style="animation-delay:0.70s"><rect x="266" y="354" width="216" height="66" rx="10" fill="#fbeaea" stroke="#b91c1c" stroke-width="1.5"/><text x="374.0" y="395" font-size="18" fill="#b91c1c" font-weight="700" text-anchor="middle">✕  Block</text></g><g class="pop" style="animation-delay:0.77s"><rect x="494" y="354" width="216" height="66" rx="10" fill="#fbeaea" stroke="#b91c1c" stroke-width="1.5"/><text x="602.0" y="395" font-size="18" fill="#b91c1c" font-weight="700" text-anchor="middle">✕  Block</text></g><g class="pop" style="animation-delay:0.84s"><rect x="722" y="354" width="216" height="66" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="1.5"/><text x="830.0" y="395" font-size="18" fill="#15803d" font-weight="700" text-anchor="middle">✓  Allow</text></g><g class="pop" style="animation-delay:0.91s"><rect x="950" y="354" width="216" height="66" rx="10" fill="#e7f5ec" stroke="#15803d" stroke-width="1.5"/><text x="1058.0" y="395" font-size="18" fill="#15803d" font-weight="700" text-anchor="middle">✓  Allow</text></g><text x="40" y="450" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Trusted can reach IoT to control smart devices, but IoT can’t reach Trusted, so a hacked smart plug can’t get to your laptop.</text>
</svg>
