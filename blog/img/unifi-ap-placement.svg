<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="UniFi access point placement: two APs centered in each half of a single-story home, and ceiling APs offset between floors in a two-story home" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>UniFi access point placement: two APs centered in each half of a single-story home, and ceiling APs offset between floors in a two-story home</title>
<rect width="1200" height="560" fill="#ffffff"/>
<text x="40" y="52" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">Where to put access points</text><text x="40" y="80" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Ceiling-mount at 8–10 ft. Center each AP in the area it covers, and offset APs between floors.</text><defs><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker></defs><text x="40" y="112" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="start">Single-story home, 2 APs (top view)</text><clipPath id="c1"><rect x="40" y="126" width="540" height="330" rx="10"/></clipPath><rect x="40" y="126" width="540" height="330" rx="10" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/><g clip-path="url(#c1)"><circle cx="175.0" cy="291.0" r="150" fill="#1d4ed8" fill-opacity="0.08" stroke="#1d4ed8" stroke-opacity="0.35" stroke-dasharray="6 6"/><circle cx="175.0" cy="291.0" r="15" fill="#1d4ed8"/><circle cx="175.0" cy="291.0" r="5" fill="#ffffff"/><circle cx="445.0" cy="291.0" r="150" fill="#1d4ed8" fill-opacity="0.08" stroke="#1d4ed8" stroke-opacity="0.35" stroke-dasharray="6 6"/><circle cx="445.0" cy="291.0" r="15" fill="#1d4ed8"/><circle cx="445.0" cy="291.0" r="5" fill="#ffffff"/></g><line x1="310.0" y1="126" x2="310.0" y2="456" stroke="#0a0a0a" stroke-width="1.5" stroke-dasharray="8 6"/><text x="175.0" y="436" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">Center of first half</text><text x="445.0" y="436" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">Center of second half</text><text x="640" y="112" font-size="17" fill="#0a0a0a" font-weight="700" text-anchor="start">Two-story home (side view)</text><rect x="640" y="126" width="520" height="150" rx="8" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/><text x="654" y="264" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">2nd floor</text><rect x="640" y="288" width="520" height="150" rx="8" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/><text x="654" y="426" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">1st floor</text><rect x="770.0" y="132" width="52" height="12" rx="6" fill="#1d4ed8"/><path d="M706.0,208 Q796.0,258 886.0,208" fill="none" stroke="#1d4ed8" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 6"/><rect x="978.0" y="294" width="52" height="12" rx="6" fill="#1d4ed8"/><path d="M914.0,370 Q1004.0,420 1094.0,370" fill="none" stroke="#1d4ed8" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="6 6"/><text x="796.0" y="172" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="middle">AP on ceiling</text><text x="1004.0" y="334" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="middle">AP on ceiling</text><text x="1146" y="264" font-size="14" fill="#1d4ed8" font-weight="700" text-anchor="end">APs offset, not stacked</text><rect x="40" y="474" width="250" height="44" rx="22" fill="#f5f6f8" stroke="#d9dce1" stroke-width="1.5"/><text x="58" y="502" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">Under 1,500 sq ft</text><text x="272" y="502" font-size="15" fill="#0a0a0a" font-weight="700" text-anchor="end">1 AP</text><rect x="306" y="474" width="250" height="44" rx="22" fill="#f5f6f8" stroke="#d9dce1" stroke-width="1.5"/><text x="324" y="502" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">1,500–3,000 sq ft</text><text x="538" y="502" font-size="15" fill="#0a0a0a" font-weight="700" text-anchor="end">2 APs</text><rect x="572" y="474" width="250" height="44" rx="22" fill="#f5f6f8" stroke="#d9dce1" stroke-width="1.5"/><text x="590" y="502" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">3,000–5,000 sq ft</text><text x="804" y="502" font-size="15" fill="#0a0a0a" font-weight="700" text-anchor="end">3–4 APs</text><rect x="838" y="474" width="330" height="44" rx="22" fill="#f5f6f8" stroke="#d9dce1" stroke-width="1.5"/><text x="856" y="502" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">Office</text><text x="1150" y="502" font-size="15" fill="#0a0a0a" font-weight="700" text-anchor="end">1 AP per 1,000–1,500 sq ft</text>
</svg>
