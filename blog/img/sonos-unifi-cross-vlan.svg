<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Sonos across UniFi VLANs: mDNS proxy for discovery, allow Trusted to Sonos, and allow Sonos to Trusted on TCP 3400, 3401 and 3500" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Sonos across UniFi VLANs: mDNS proxy for discovery, allow Trusted to Sonos, and allow Sonos to Trusted on TCP 3400, 3401 and 3500</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.grow{animation:grow 1s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}
.flow{stroke-dasharray:10 8;animation:flow .9s linear infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.8s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.04)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="500" fill="#ffffff"/>
<text x="40" y="52" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">Sonos on an IoT VLAN: the three things to allow</text><text x="40" y="80" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Phones on Trusted, speakers on IoT. Most setups miss step 3.</text><defs><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs><rect x="40" y="120" width="300" height="300" rx="14" fill="#e8eefc" stroke="#1d4ed8" stroke-width="2"/><text x="64" y="158" font-size="19" fill="#1d4ed8" font-weight="700" text-anchor="start">Trusted VLAN</text><rect x="860" y="120" width="300" height="300" rx="14" fill="#fdf3e4" stroke="#b45309" stroke-width="2"/><text x="884" y="158" font-size="19" fill="#b45309" font-weight="700" text-anchor="start">IoT VLAN</text><rect x="70" y="230" width="240" height="110" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/><text x="190" y="278" font-size="19" fill="#0a0a0a" font-weight="700" text-anchor="middle">Sonos app</text><text x="190" y="304" font-size="15" fill="#5f6368" font-weight="400" text-anchor="middle">on your phone</text><rect x="890" y="230" width="240" height="110" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2"/><text x="1010" y="278" font-size="19" fill="#0a0a0a" font-weight="700" text-anchor="middle">Sonos speakers</text><text x="1010" y="304" font-size="15" fill="#5f6368" font-weight="400" text-anchor="middle">fixed IPs, one group</text><line x1="320" y1="238" x2="880" y2="238" stroke="#15803d" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#aG)" class="flow"/><circle cx="380" cy="214" r="15" fill="#15803d"/><text x="380" y="220" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="404" y="220" font-size="15" fill="#15803d" font-weight="700" text-anchor="start">Discovery: Gateway mDNS Proxy on both VLANs</text><line x1="320" y1="290" x2="880" y2="290" stroke="#1d4ed8" stroke-width="3" marker-end="url(#aB)" class="flow"/><circle cx="380" cy="268" r="15" fill="#1d4ed8"/><text x="380" y="274" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="404" y="274" font-size="15" fill="#1d4ed8" font-weight="700" text-anchor="start">Allow Trusted → Sonos speakers</text><line x1="880" y1="334" x2="320" y2="334" stroke="#b45309" stroke-width="3" marker-end="url(#aA)" class="flow"/><circle cx="380" cy="362" r="15" fill="#b45309"/><text x="380" y="368" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="404" y="368" font-size="15" fill="#b45309" font-weight="700" text-anchor="start">Allow Sonos → Trusted on TCP 3400, 3401, 3500</text><text x="404" y="390" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">Skip this and music plays, but the app never updates.</text><text x="40" y="462" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Keep policies limited to your Sonos object instead of opening the whole IoT zone.</text>
</svg>
