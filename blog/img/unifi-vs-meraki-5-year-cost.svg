<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="5-year cost comparison: UniFi about $1,200 versus Meraki $8,000 to $15,000 for 5 managed devices" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>5-year cost comparison: UniFi about $1,200 versus Meraki $8,000 to $15,000 for 5 managed devices</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.grow{animation:grow 1s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box;transform-origin:left center}
.flow{stroke-dasharray:10 8;animation:flow .9s linear infinite}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.8s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(.92)}50%{opacity:1;transform:scale(1.04)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="1200" height="470" fill="#ffffff"/>
<text x="40" y="52" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">5-year cost for a small business with 5 managed devices</text><text x="40" y="80" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Hardware plus licenses. UniFi has no license fee; Meraki requires one per device, every year.</text><line x1="230.0" y1="120" x2="230.0" y2="330" stroke="#eceef1" stroke-width="1.5"/><text x="230.0" y="356" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">$0</text><line x1="455.0" y1="120" x2="455.0" y2="330" stroke="#eceef1" stroke-width="1.5"/><text x="455.0" y="356" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">$4,000</text><line x1="680.0" y1="120" x2="680.0" y2="330" stroke="#eceef1" stroke-width="1.5"/><text x="680.0" y="356" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">$8,000</text><line x1="905.0" y1="120" x2="905.0" y2="330" stroke="#eceef1" stroke-width="1.5"/><text x="905.0" y="356" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">$12,000</text><line x1="1130.0" y1="120" x2="1130.0" y2="330" stroke="#eceef1" stroke-width="1.5"/><text x="1130.0" y="356" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">$16,000</text><text x="210" y="182" font-size="20" fill="#0a0a0a" font-weight="700" text-anchor="end">UniFi</text><g class="grow" style="animation-delay:0.20s"><rect x="230" y="150" width="67.5" height="48" rx="6" fill="#1d4ed8"/></g><g class="rise" style="animation-delay:0.70s"><text x="311.5" y="182" font-size="18" fill="#1d4ed8" font-weight="700" text-anchor="start">about $1,200</text></g><text x="210" y="282" font-size="20" fill="#0a0a0a" font-weight="700" text-anchor="end">Meraki</text><g class="grow" style="animation-delay:0.50s"><rect x="230" y="250" width="450.0" height="48" rx="6" fill="#0a0a0a"/></g><g class="grow" style="animation-delay:1.30s"><rect x="680.0" y="250" width="393.75" height="48" rx="6" fill="#0a0a0a" fill-opacity="0.25"/></g><g class="rise" style="animation-delay:1.90s"><text x="1059.75" y="282" font-size="18" fill="#0a0a0a" font-weight="700" text-anchor="end">$8,000–$15,000</text></g><rect x="230" y="392" width="18" height="14" rx="3" fill="#0a0a0a"/><text x="256" y="404" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">Low estimate</text><rect x="380" y="392" width="18" height="14" rx="3" fill="#0a0a0a" fill-opacity="0.25"/><text x="406" y="404" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">Range up to high estimate</text><text x="40" y="446" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">Estimates from this article. If a Meraki license lapses, the hardware stops working as a managed device.</text>
</svg>
