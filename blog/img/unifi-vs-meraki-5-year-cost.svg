<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="5-year cost comparison: UniFi about $1,200 versus Meraki $8,000 to $15,000 for 5 managed devices" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>5-year cost comparison: UniFi about $1,200 versus Meraki $8,000 to $15,000 for 5 managed devices</title>
<rect width="1200" height="470" fill="#ffffff"/>
<text x="40" y="52" font-size="26" fill="#0a0a0a" font-weight="700" text-anchor="start">5-year cost for a small business with 5 managed devices</text><text x="40" y="80" font-size="15" fill="#5f6368" font-weight="400" text-anchor="start">Hardware plus licenses. UniFi has no license fee; Meraki requires one per device, every year.</text><line x1="230.0" y1="120" x2="230.0" y2="330" stroke="#eceef1" stroke-width="1.5"/><text x="230.0" y="356" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">$0</text><line x1="455.0" y1="120" x2="455.0" y2="330" stroke="#eceef1" stroke-width="1.5"/><text x="455.0" y="356" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">$4,000</text><line x1="680.0" y1="120" x2="680.0" y2="330" stroke="#eceef1" stroke-width="1.5"/><text x="680.0" y="356" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">$8,000</text><line x1="905.0" y1="120" x2="905.0" y2="330" stroke="#eceef1" stroke-width="1.5"/><text x="905.0" y="356" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">$12,000</text><line x1="1130.0" y1="120" x2="1130.0" y2="330" stroke="#eceef1" stroke-width="1.5"/><text x="1130.0" y="356" font-size="14" fill="#5f6368" font-weight="400" text-anchor="middle">$16,000</text><text x="210" y="182" font-size="20" fill="#0a0a0a" font-weight="700" text-anchor="end">UniFi</text><rect x="230" y="150" width="67.5" height="48" rx="6" fill="#1d4ed8"/><text x="311.5" y="182" font-size="18" fill="#1d4ed8" font-weight="700" text-anchor="start">about $1,200</text><text x="210" y="282" font-size="20" fill="#0a0a0a" font-weight="700" text-anchor="end">Meraki</text><rect x="230" y="250" width="450.0" height="48" rx="6" fill="#0a0a0a"/><rect x="680.0" y="250" width="393.75" height="48" rx="6" fill="#0a0a0a" fill-opacity="0.25"/><text x="1059.75" y="282" font-size="18" fill="#0a0a0a" font-weight="700" text-anchor="end">$8,000–$15,000</text><rect x="230" y="392" width="18" height="14" rx="3" fill="#0a0a0a"/><text x="256" y="404" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">Low estimate</text><rect x="380" y="392" width="18" height="14" rx="3" fill="#0a0a0a" fill-opacity="0.25"/><text x="406" y="404" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">Range up to high estimate</text><text x="40" y="446" font-size="14" fill="#5f6368" font-weight="400" text-anchor="start">Estimates from this article. If a Meraki license lapses, the hardware stops working as a managed device.</text>
</svg>
