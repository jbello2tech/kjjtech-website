<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1334" width="640" height="1334" role="img" aria-label="UniFi Protect layout: cameras are powered by a PoE switch on their own camera network, record locally to a UniFi console with a hard drive, and you view them from the Protect app" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>UniFi Protect layout: cameras are powered by a PoE switch on their own camera network, record locally to a UniFi console with a hard drive, and you view them from the Protect app</title>
<style>
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.pop{animation:pop .5s cubic-bezier(.2,.8,.3,1.25) both;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1s linear infinite}
.drift{animation:drift 9s ease-in-out infinite alternate}
.drift2{animation:drift 12s ease-in-out infinite alternate-reverse}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes flow{to{stroke-dashoffset:-36}}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.pkt{display:none}}
</style>
<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.07"/></filter>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1.2" fill="#e6e6e6"/></pattern>
</defs>
<rect width="640" height="1334" fill="#ffffff"/>
<text x="32.0" y="58.0" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">How a UniFi Protect system</text><text x="32.0" y="99.0" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">fits together</text><text x="32.0" y="144.0" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">Cameras get power and data over one cable,</text><text x="32.0" y="174.0" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">record on site, and you watch from the app.</text><rect x="20" y="214" width="600" height="300" rx="20" fill="#f9f9f9" stroke="#ececec"/><rect x="20" y="214" width="600" height="300" rx="20" fill="url(#dots)"/><text x="40.0" y="248.0" font-size="22" fill="#5f6368" font-weight="600" text-anchor="start" letter-spacing="2.2">CAMERA NETWORK</text><path id="p1" d="M120 417 C120 504 320 494 320 568" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="0.00s"/><animateMotion dur="1.6s" begin="0.00s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle><path id="p2" d="M320 417 C320 504 320 494 320 568" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="0.50s"/><animateMotion dur="1.6s" begin="0.50s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle><path id="p3" d="M520 417 C520 504 320 494 320 568" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="1.00s"/><animateMotion dur="1.6s" begin="1.00s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle><g class="rise" style="animation-delay:0.10s"><rect x="35.0" y="311.0" width="170" height="106" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="