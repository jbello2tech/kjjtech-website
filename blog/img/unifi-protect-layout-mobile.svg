e-width="1.2" filter="url(#sh)"/><g transform="translate(299.0,582.0) scale(1.75)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><rect x="1" y="6" width="22" height="12" rx="2"/><circle cx="6" cy="12" r="1.3" fill="currentColor"/><circle cx="10" cy="12" r="1.3" fill="currentColor"/><circle cx="14" cy="12" r="1.3" fill="currentColor"/><circle cx="18" cy="12" r="1.3" fill="currentColor"/></g><text x="320.0" y="658.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">PoE switch</text><text x="320.0" y="685.0" font-size="19" fill="#5f6368" font-weight="400" text-anchor="middle">Power + data</text></g><path id="p4" d="M320 700 L320 788" fill="none" stroke="#c4c4c4" stroke-width="1.8" stroke-linejoin="round"/><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="0.40s"/><animateMotion dur="2.0s" begin="0.40s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="1.07s"/><animateMotion dur="2.0s" begin="1.07s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="1.73s"/><animateMotion dur="2.0s" begin="1.73s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle><g class="rise" style="animation-delay:0.50s"><rect x="170.0" y="788.0" width="300" height="132" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="2" filter="url(#sh)"/><g transform="translate(299.0,802.0) scale(1.75)" fill="none" stroke="#1d4ed8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#1d4ed8"><rect x="1" y="7" width="22" height="10" rx="1.5"/><rect x="4" y="10" width="4" height="4" rx="0.5"/><rect x="10" y="10" width="4" height="4" rx="0.5"/><circle cx="19" cy="12" r="1" fill="currentColor"/></g><text x="320.0" y="878.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">UniFi console</text><text x="320.0" y="905.0" font-size="19" fill="#5f6368" font-weight="400" text-anchor="middle">Runs Protect</text></g><g transform="translate(296.0,930.8) scale(7)"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="#ffffff" fill-opacity="0.85" stroke="#c4c4c4" stroke-width="1.5" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/></g><text x="409.6" y="1051.2" font-size="17" fill="#5f6368" font-weight="600" text-anchor="middle" letter-spacing="2.4">INTERNET</text><path d="M320 920 L320 1118" fill="none" stroke="#1d4ed8" stroke-opacity="0.10" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path id="p5" d="M320 920 L320 1118" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-dasharray="10 8" class="flow" stroke-linecap="round" stroke-linejoin="round"/><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="1.00s"/><animateMotion dur="2.6s" begin="1.00s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle><circle class="pkt" r="5.5" fill="#1d4ed8" opacity="0"><set attributeName="opacity" to="1" begin="2.30s"/><animateMotion dur="2.6s" begin="2.30s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle><g class="rise" style="animation-delay:0.80s"><rect x="170.0" y="1118.0" width="300" height="132" rx="14" fill="#ffffff" stroke="#ececec" stroke-width="1.2" filter="url(#sh)"/><g transform="translate(299.0,1132.0) scale(1.75)" fill="none" stroke="#0a0a0a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" color="#0a0a0a"><rect x="6" y="2" width="12" height="20" rx="2.5"/><line x1="10.5" y1="18" x2="13.5" y2="18"/></g><text x="320.0" y="1208.0" font-size="24" fill="#0a0a0a" font-weight="700" text-anchor="middle">Protect app</text><text x="320.0" y="1235.0" font-size="19" fill="#5f6368" font-weight="400" text-anchor="middle">Live + playback</text><