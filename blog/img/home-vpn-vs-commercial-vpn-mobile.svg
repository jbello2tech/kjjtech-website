<text x="32.0" y="58.0" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">Where your traffic exits is</text><text x="32.0" y="99.0" font-size="34" fill="#0a0a0a" font-weight="700" text-anchor="start">the IP the world sees</text><text x="32.0" y="144.0" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">Both are encrypted. The difference is the last</text><text x="32.0" y="174.0" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">hop: a shared data center, or your own home</text><text x="32.0" y="204.0" font-size="22" fill="#5f6368" font-weight="400" text-anchor="start">connection.</text><rect x="20" y="244" width="292" height="1060" rx="20" fill="#f9f9f9" stroke="#ececec"/><rect x="20" y="244" width="292" height="1060" rx="20" fill="url(#dots)"/><text x="40.0" y="278.0" font-size="22" fill="#5f6368" font-weight="600" text-anchor="start" letter-spacing="2.2">COMMERCIAL</text><rect x="328" y="244" width="292" height="1060" rx="20" fill="#f9f9f9" stroke="#ececec"/><rect x="328" y="244" width="292" height="1060" rx="20" fill="url(#dots)"/><text x="348.0" y="278.0" font-size="22" fill="#5f6368" font-weight="600" text-anchor="start" letter-spacing="2.2">HOME VPN</text><g transform="translate(91.6,656.1) scale(9.2)"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z" fill="#ffffff" fill-opacity="0.85" stroke="#c4c4c4" stroke-width="1.5" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/></g><text x="237.4" y="814.3" font-size="17" fill="#5f6368" font-weight="600" text-anchor="middle" letter-spacing="2.4">INTERNET</text><path d="M166 460 L166 898" fill="none" stroke="#b91c1c" stroke-opacity="0.10" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path id="p1" d="M166 460 L166 898" fill="none" stroke="#b91c1c" stroke-width="2.2" stroke-dasharray="10 8" class="flow" stroke-linecap="round" stroke-linejoin="round"/><circle class="pkt" r="5.5" fill="#b91c1c" opacity="0"><set attributeName="opacity" 