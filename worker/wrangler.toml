name = "kjjtech-reviews"
main = "src/index.js"
compatibility_date = "2026-04-01"
account_id = "01d3e66e6823e2669272faa7917f9fab"

[vars]
GITHUB_REPO = "jbello2tech/kjjtech-website"
GITHUB_BRANCH = "main"
WORKER_ORIGIN = "https://reviews.kjjtech.com"
MAIL_FROM = "jbello@kjjtech.com"
# MAIL_POSTAL_ADDRESS = "KJJ Tech, PO Box ..., Orlando, FL 328xx"  # shown in email footer

# Lead emails: fires 12:00 and 13:00 UTC; code only sends when it is 8 AM in New York (handles DST)
[triggers]
crons = ["0 12 * * *", "0 13 * * *"]

[[routes]]
pattern = "reviews.kjjtech.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "kjjtech_reviews"
database_id = "14c3bc55-6130-43eb-87d0-197fa39cc90d"
